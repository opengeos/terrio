[workspace]
resolver = "3"
members = ["crates/*", "python", "js"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/opengeos/terrio"
homepage = "https://github.com/opengeos/terrio"
authors = ["Qiusheng Wu <giswqs@gmail.com>"]

[workspace.dependencies]
# Memory-mapped reads of SQLite files (GeoPackage, MBTiles), native builds only.
memmap2 = "0.9"
terrio = { path = "crates/terrio", version = "0.5.0" }
terrio-crs = { path = "crates/terrio-crs", version = "0.1.0", default-features = false }
# For the Python package (not published to crates.io), so without a version to keep in step.
terrio-cli = { path = "crates/terrio-cli" }

# Format drivers, coordinate reference systems
wbraster = "0.2.1"
# KMZ always; GeoParquet and OSM PBF with terrio's `parquet` and `osm` features.
wbvector = { version = "0.1.6", features = ["kmz"] }
wbprojection = "0.3.3"
# Karney's geodesics, for the ellipsoidal gnomonic projection (pure Rust).
geographiclib-rs = { version = "0.2.7", default-features = false }
# Planar topology, buffering, validity and polygon repair, without native libraries.
geo = { version = "0.33.1", default-features = false, features = ["spade"] }
# Candidate lookup for polygon overlays; the same pure-Rust R-tree used by geo.
rstar = "0.12.2"
# Delaunay and constrained triangulations for hulls and linear gridding; the version geo uses.
spade = "2.15.1"

# Native CAD codecs, sequential on every target (including WebAssembly).
acadrust = { version = "=0.6.7", default-features = false }

flatgeobuf = { version = "6", default-features = false }
# The version flatgeobuf's generated code is built with.
flatbuffers = "=24.12.23"
# GeoParquet writing; the same versions wbvector reads GeoParquet with.
parquet = { version = "58", default-features = false, features = ["arrow", "snap"] }
arrow-array = "58"
arrow-schema = "58"
# Arrow IPC streams of vector layers; already built for parquet.
arrow-ipc = { version = "58", default-features = false }
arrow-buffer = "58"
bytes = "1"
quick-xml = "0.42"
# OpenStreetMap PBF decoding, the version wbvector uses.
osmpbfreader = "0.19"
# Its Zstandard (a C library) is enabled by the `libzstd` features of terrio and terrio-crs only:
# otherwise terrio decodes Zstandard with `ruzstd`.
tiff = { version = "0.11", features = ["webp"] }
half = "2"
flate2 = "1"
weezl = "0.2"
png = "0.18"
lz4_flex = { version = "0.14", default-features = false, features = ["alloc", "safe-decode", "checked-decode"] }
ruzstd = "0.9"
netcdf-reader = { version = "0.9", default-features = false, features = ["netcdf4"] }
hdf5-reader = { version = "0.9", default-features = false }
# The portable decoder: the same pixels on every platform, closer to libjpeg's than its SIMD paths.
jpeg-decoder = { version = "0.3", default-features = false, features = ["platform_independent"] }
# GeoPackage JPEG tiles; the version wbraster already uses.
jpeg-encoder = "0.7"
# WebP tiles of PMTiles and MBTiles archives; the version tiff already uses.
image-webp = "0.2"
# Pure-Rust WebP encoder for GeoTIFF/COG; already used transitively by wbgeotiff.
webp-rust = "0.2.1"
openjp2 = { version = "0.6", default-features = false, features = ["std"] }
# GRIB2 CCSDS packing (its pure-Rust decoder); without its C features (OpenJPEG, libaec): terrio
# decodes the other packings itself (JPEG 2000 with openjp2).
gribberish = { version = "1.9", default-features = false }
# The bit slices gribberish's decoders take.
bitvec = "1"
# GeoTIFF compressions GDAL writes and the tiff crate does not read: LERC, JPEG XL and LZMA (XZ).
lerc-reader = { version = "0.5", default-features = false }
lerc-core = "0.5"
lerc-writer = "0.5"
# Lossless JPEG XL encoding of GeoTIFF chunks (without threads, for WebAssembly).
zune-jpegxl = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"
jxl-oxide = { version = "0.12", default-features = false }
# AVIF tiles: a pure-Rust port of dav1d, without its assembly so that it builds for WebAssembly.
rusty_av1d = { version = "1.2", default-features = false, features = ["bitdepth_8"] }
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz"] }
zstd = "0.14"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# POSIX file locks for in-place SQLite updates (Unix).
libc = "0.2"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = "3"
hmac = "0.13"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
# LASzip compression of point clouds (LAZ, COPC), pure Rust.
laz = "0.13"
# E57 laser scans, pure Rust.
e57 = "0.11"
# Delaunay triangulation, for gridding points by linear interpolation.
delaunator = "1"
# Data parallelism (native builds only).
rayon = "1.10"
# The optional GDAL backend (the `gdal` feature): the only C dependency, opt-in.
gdal = "0.19"
gdal-sys = "0.12"

# Full DWARF for the codec-heavy workspace makes local/test artifacts very large.
# Opt in when debugging with CARGO_PROFILE_DEV_DEBUG=2.
[profile.dev]
debug = 0

# openjp2 frees never-allocated code-block buffers (a null `dealloc`, harmless with the system
# allocator) and trips the standard library's debug-mode precondition checks: build it as in
# release. Its inverse wavelet transform of a decode area also adds samples just outside the area,
# uninitialized memory whose results are discarded: with overflow checks, a window read panicked
# now and then, as the garbage happened to overflow (OpenJPEG wraps, as a release build does).
[profile.dev.package.openjp2]
debug-assertions = false
overflow-checks = false
opt-level = 3

# The WebAssembly modules of the npm package (`node js/build.mjs`): one codegen unit and
# whole-program LTO, optimized for size ("s") but for the codecs, optimized for speed; wasm-opt then
# runs with -Oz (js/Cargo.toml). The full module is 21% smaller than with the release profile (16.4
# MB, 5.6 MB gzipped, from 20.6 and 6.7 MB), and decodes and writes as fast. All "s", it is 24%
# smaller but JPEG 2000 decodes 25% slower; "z" is 1.5 to 2 times slower.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

# The codecs, decoding and encoding pixels and points.
[profile.wasm-release.package]
openjp2 = { opt-level = 3 }
tiff = { opt-level = 3 }
weezl = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
zlib-rs = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }
crc32fast = { opt-level = 3 }
jpeg-decoder = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
zune-jpegxl = { opt-level = 3 }
jxl-vardct = { opt-level = 3 }
jxl-modular = { opt-level = 3 }
jxl-render = { opt-level = 3 }
jxl-frame = { opt-level = 3 }
jxl-coding = { opt-level = 3 }
jxl-grid = { opt-level = 3 }
ruzstd = { opt-level = 3 }
lerc-core = { opt-level = 3 }
lerc-reader = { opt-level = 3 }
lerc-writer = { opt-level = 3 }
lzma-rust2 = { opt-level = 3 }
laz = { opt-level = 3 }
rusty_av1d = { opt-level = 3 }
image-webp = { opt-level = 3 }
lz4_flex = { opt-level = 3 }

# HDF5 files written in the earliest format with version 1/2 compound datatypes (every HEC-RAS
# geometry and plan file, among others) fail in hdf5-reader 0.9.1, and old fill value messages
# read wrong. Fixed in roteiro-gis/netcdf-rust#95; until a release carries it, build against that
# branch. All four crates come from the same commit so their shared types agree. (`cargo publish`
# ignores this section: a published terrio uses the crates.io release.)
[patch.crates-io]
hdf5-core = { git = "https://github.com/gpt-cmdr/netcdf-rust", rev = "24ff6fcfcc79a35c30aa5d8cb3028ab4d9d00564" }
hdf5-reader = { git = "https://github.com/gpt-cmdr/netcdf-rust", rev = "24ff6fcfcc79a35c30aa5d8cb3028ab4d9d00564" }
netcdf-core = { git = "https://github.com/gpt-cmdr/netcdf-rust", rev = "24ff6fcfcc79a35c30aa5d8cb3028ab4d9d00564" }
netcdf-reader = { git = "https://github.com/gpt-cmdr/netcdf-rust", rev = "24ff6fcfcc79a35c30aa5d8cb3028ab4d9d00564" }
