[workspace]
resolver = "3"
members = ["crates/*", "python", "js"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/opengeos/terrio"
homepage = "https://github.com/opengeos/terrio"
authors = ["Qiusheng Wu <giswqs@gmail.com>"]

[workspace.dependencies]
terrio = { path = "crates/terrio", version = "0.1.0" }

# Format drivers, coordinate reference systems
wbraster = "0.2.1"
wbvector = { version = "0.1.6", features = ["geoparquet", "kmz", "osmpbf"] }
wbprojection = "0.3.3"

flatgeobuf = { version = "6", default-features = false }
# The version flatgeobuf's generated code is built with.
flatbuffers = "=24.12.23"
# GeoParquet writing; the same versions wbvector reads GeoParquet with.
parquet = { version = "58", default-features = false, features = ["arrow", "snap"] }
arrow-array = "58"
arrow-schema = "58"
# Arrow IPC streams of vector layers; already built for parquet.
arrow-ipc = { version = "58", default-features = false }
arrow-buffer = "58"
bytes = "1"
quick-xml = "0.42"
# OpenStreetMap PBF decoding, the version wbvector uses.
osmpbfreader = "0.19"
tiff = { version = "0.11", features = ["zstd", "webp"] }
half = "2"
flate2 = "1"
weezl = "0.1"
png = "0.18"
lz4_flex = { version = "0.13", default-features = false, features = ["safe-decode", "checked-decode"] }
ruzstd = "0.9"
netcdf-reader = { version = "0.9", default-features = false, features = ["netcdf4"] }
jpeg-decoder = { version = "0.3", default-features = false }
# GeoPackage JPEG tiles; the version wbraster already uses.
jpeg-encoder = "0.7"
# WebP tiles of PMTiles and MBTiles archives; the version tiff already uses.
image-webp = "0.2"
openjp2 = { version = "0.6", default-features = false, features = ["std"] }
zstd = "0.14"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = "3"
hmac = "0.13"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
# LASzip compression of point clouds (LAZ, COPC), pure Rust.
laz = "0.13"
# Data parallelism (native builds only).
rayon = "1.10"
# The optional GDAL backend (the `gdal` feature): the only C dependency, opt-in.
gdal = "0.19"
gdal-sys = "0.12"

# openjp2 frees never-allocated code-block buffers (a null `dealloc`, harmless with the system
# allocator) and trips the standard library's debug-mode precondition checks: build it as in
# release.
[profile.dev.package.openjp2]
debug-assertions = false
opt-level = 3
