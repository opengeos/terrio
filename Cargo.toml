[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/opengeos/terrio"
homepage = "https://github.com/opengeos/terrio"
authors = ["Qiusheng Wu <giswqs@gmail.com>"]

[workspace.dependencies]
terrio = { path = "crates/terrio", version = "0.0.1" }

# Format drivers, coordinate reference systems
wbraster = "0.2.1"
wbvector = { version = "0.1.6", features = ["geoparquet", "kmz", "osmpbf"] }
wbprojection = "0.3.3"

tiff = { version = "0.11", features = ["zstd", "webp"] }
half = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = "3"
hmac = "0.12"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
