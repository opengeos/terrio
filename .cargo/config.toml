# OpenJPEG's Rust port (`openjp2`, the JPEG 2000 codec) is built as a C-ABI library too, and that
# library calls the C allocator, which WebAssembly has no libc to supply. Its link may leave those
# symbols undefined: terrio's own wasm32 builds define them (`drivers::jp2::wasm_libc`), so the
# libraries and packages built from it resolve them. Projects building terrio for
# wasm32-unknown-unknown need the same flag.
#
# WebAssembly SIMD (`simd128`, Chrome and Edge 91, Firefox 89, Safari 16.4, Node.js 16.4): zlib-rs
# decodes with it, and LLVM vectorizes loops with it. A Zarr store of zlib chunks reads 20% faster
# (warm reads, Node.js); other codecs gain up to 4%. js/build.mjs repeats these flags where its
# RUSTFLAGS replace them (the threaded module; the memory64 one is built without SIMD).
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128", "-C", "link-arg=--allow-undefined"]
