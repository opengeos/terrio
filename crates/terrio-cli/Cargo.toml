[package]
name = "terrio-cli"
description = "Command-line interface for terrio: GDAL-style info, convert, translate and warp in pure Rust"
readme = "../../README.md"
keywords = ["gis", "geospatial", "gdal", "raster", "vector"]
categories = ["science::geo", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = []
## The optional GDAL backend: open anything GDAL can (`GDAL:` paths, `--driver gdal`), write
## rasters with GDAL's drivers (`-f NITF`). Needs GDAL installed.
gdal = ["terrio/gdal"]

# The command line as a library (`terrio_cli::run`), which the Python package's `terrio` command
# runs too.
[lib]
name = "terrio_cli"
path = "src/lib.rs"

[[bin]]
name = "terrio"
path = "src/main.rs"

# `cargo binstall terrio-cli` installs the binaries attached to the GitHub release
# (release-build.yml); Linux hosts get the static musl builds.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/terrio-cli-v{ version }-{ target }{ archive-suffix }"
bin-dir = "terrio-cli-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
terrio.workspace = true
clap.workspace = true
serde_json.workspace = true
getrandom.workspace = true
tempfile.workspace = true

# Silencing drivers' prints (`cmd::quiet`): WASI has no file descriptors to redirect.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
gag.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The drives the file browser of `terrio ui` lists above a drive's root.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
sha2.workspace = true
