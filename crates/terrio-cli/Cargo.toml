[package]
name = "terrio-cli"
description = "Command-line interface for terrio"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
## The optional GDAL backend: open anything GDAL can (`GDAL:` paths, `--driver gdal`), write
## rasters with GDAL's drivers (`-f NITF`). Needs GDAL installed.
gdal = ["terrio/gdal"]

[[bin]]
name = "terrio"
path = "src/main.rs"

[dependencies]
terrio.workspace = true
clap.workspace = true
serde_json.workspace = true
gag = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
