<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrio</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f5; --panel: #ffffff; --text: #1d2521; --muted: #5d6a63; --line: #d9dfda;
  --accent: #1b6e4f; --accent-text: #ffffff; --tint: #e4f0ea; --bad: #b3261e; --code: #eef1ee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141916; --panel: #1c231f; --text: #e6ebe7; --muted: #9aa8a0; --line: #323c36;
    --accent: #5cc29a; --accent-text: #0d1a14; --tint: #24352c; --bad: #f2877e; --code: #111512;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); height: 100%; }
aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.brand { padding: 14px 16px 2px; font-size: 18px; font-weight: 650; }
.brand small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.cwd { padding: 0 16px 10px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
#search { margin: 0 12px 10px; width: calc(100% - 24px); }
#commands { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 0 8px 12px; }
#commands button { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 6px 8px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px; }
#commands button:hover { background: var(--tint); }
#commands button[aria-current="true"] { background: var(--accent); color: var(--accent-text); }
main { overflow-y: auto; padding: 24px clamp(16px, 4vw, 40px) 48px; }
.content { max-width: 860px; }
h1 { font-size: 24px; margin: 0 0 4px; }
.about { color: var(--muted); white-space: pre-line; margin: 0 0 20px; }
.field { margin-bottom: 14px; }
.field > label, .field > .label { display: block; font-weight: 600; margin-bottom: 3px; }
.field .flag { font-weight: 400; color: var(--muted); margin-left: 6px; }
.required { color: var(--bad); }
.help { color: var(--muted); font-size: 13px; margin-top: 3px; white-space: pre-line; overflow-wrap: anywhere; }
input[type=text], input[type=search], select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: inherit; font: inherit; }
textarea { min-height: 68px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.path { display: flex; gap: 6px; align-items: flex-start; }
.path > :first-child { flex: 1; min-width: 0; }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 600; }
.check input { margin-top: 4px; }
details { border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; margin: 18px 0; background: var(--panel); }
summary { cursor: pointer; padding: 10px 0; font-weight: 600; }
details[open] summary { margin-bottom: 6px; }
button.action { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: inherit; font: inherit; cursor: pointer; white-space: nowrap; }
button.action:hover { background: var(--tint); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.primary:hover { background: var(--accent); filter: brightness(1.08); }
button:disabled { opacity: .55; cursor: default; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 8px; }
.status { color: var(--muted); font-size: 13px; }
.status.bad { color: var(--bad); }
pre { margin: 0; padding: 10px 12px; background: var(--code); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
#output { max-height: 60vh; overflow-y: auto; margin-top: 8px; }
#output.bad { border-color: var(--bad); }
h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 18px 0 4px; }
dialog { width: min(640px, calc(100vw - 32px)); max-height: 80vh; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: inherit; padding: 16px; }
dialog::backdrop { background: rgb(0 0 0 / .45); }
#browse-path { font-size: 13px; overflow-wrap: anywhere; margin-bottom: 8px; color: var(--muted); }
#browse-list { list-style: none; margin: 0 0 12px; padding: 0; height: 50vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
#browse-list button { display: flex; justify-content: space-between; gap: 12px; width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 5px 10px; cursor: pointer; overflow-wrap: anywhere; }
#browse-list button:hover { background: var(--tint); }
#browse-list .size { color: var(--muted); font-size: 12px; white-space: nowrap; }
.dialog-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 38vh minmax(0, 1fr); }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Terrio <small id="version"></small></div>
    <div class="cwd" id="cwd"></div>
    <input id="search" type="search" placeholder="Search commands" aria-label="Search commands">
    <ul id="commands"></ul>
  </aside>
  <main><div class="content" id="content"><p class="status" id="startup">Loading…</p></div></main>
</div>
<dialog id="browse">
  <div id="browse-path"></div>
  <ul id="browse-list"></ul>
  <div class="dialog-bar">
    <button type="button" class="action" id="browse-up">Up</button>
    <button type="button" class="action" id="browse-folder">Use this folder</button>
    <button type="button" class="action" id="browse-close">Close</button>
  </div>
</dialog>
<script>
"use strict";
// Everything from the server or the file system reaches the page through textContent or value,
// never as markup: a file may be named anything.
const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
const byId = (id) => document.getElementById(id);
const headers = { "X-Terrio-Token": token };

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key.startsWith("aria-")) node.setAttribute(key, value);
    else node[key] = value;
  }
  node.append(...children);
  return node;
}

async function api(path, body) {
  const options = body === undefined ? { headers } : { method: "POST", headers, body: JSON.stringify(body) };
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

// Commands are listed by their leaves: `vsi sync`, not `vsi`.
function leaves(command) {
  return command.subcommands.length ? command.subcommands.flatMap(leaves) : [command];
}

const isFlag = (arg) => arg.num_args.max === 0 && arg.action !== "count";
const isShown = (arg) => !arg.hidden && !["help", "help_short", "help_long", "version"].includes(arg.action);
const flagName = (arg) => (arg.long ? `--${arg.long}` : arg.short ? `-${arg.short}` : "");

/** How a field's text becomes the command line: "one", or several values split per `line` or `word`. */
function layout(arg) {
  const max = arg.num_args.max;
  // A path may hold spaces, so a list of paths or positionals has one value per line.
  if (max === null && (arg.position != null || arg.type === "path")) return { multi: true, split: "line", each: false };
  if (arg.action === "append") return max === 1 ? { multi: true, split: "line", each: true } : { multi: true, split: "word", each: true };
  if (max === null) return { multi: true, split: "line", each: false };
  if (max > 1) return { multi: false, split: "word", each: false };
  return { multi: false, split: "none", each: false };
}

/** The values of a field, as occurrences of the option, each a list of command-line tokens. */
function occurrences(arg, text) {
  const { split, each } = layout(arg);
  const lines = text.split("\n").map((line) => line.trim()).filter(Boolean);
  if (!lines.length) return [];
  if (split === "none") return [[text.trim()]];
  if (split === "line") return each ? lines.map((line) => [line]) : [lines];
  const words = lines.map((line) => line.split(/\s+/));
  return each ? words : [words.flat()];
}

function commandLine(command, fields) {
  const options = [], positionals = [];
  for (const { arg, read } of fields) {
    const value = read();
    if (arg.position != null) {
      positionals.push({ arg, values: occurrences(arg, value).flat() });
    } else if (isFlag(arg)) {
      if (value) options.push(flagName(arg));
    } else if (arg.action === "count") {
      for (let i = 0; i < Number(value || 0); i++) options.push(flagName(arg));
    } else {
      for (const tokens of occurrences(arg, value)) {
        // `--x=-1`: a value beginning with a hyphen is not taken for an option.
        if (tokens.length === 1 && arg.long) options.push(`--${arg.long}=${tokens[0]}`);
        else options.push(flagName(arg), ...tokens);
      }
    }
  }
  positionals.sort((a, b) => a.arg.position - b.arg.position);
  const needsSeparator = positionals.some((p) => !p.arg.allow_hyphen_values && p.values.some((v) => v.startsWith("-")));
  return [...command.path.slice(2), ...options, ...(needsSeparator ? ["--"] : []), ...positionals.flatMap((p) => p.values)];
}

function shellQuote(token) {
  return /^[\w@%+=:,./-]+$/.test(token) ? token : `'${token.replaceAll("'", `'\\''`)}'`;
}

let browseTarget = null;
function pathField(input) {
  const button = el("button", { type: "button", className: "action", textContent: "Browse…" });
  button.addEventListener("click", () => openBrowser(input));
  return el("div", { className: "path" }, input, button);
}

function field(arg, id) {
  const flag = flagName(arg);
  const name = arg.value_names.length ? arg.value_names.join(" ") : arg.name.toUpperCase();
  const title = arg.position != null ? name : flag;
  const help = arg.description ? el("div", { className: "help", textContent: arg.description }) : "";

  if (isFlag(arg)) {
    const input = el("input", { type: "checkbox", id });
    const label = el("label", { className: "check", htmlFor: id }, input, el("span", { textContent: flag }));
    return { arg, node: el("div", { className: "field" }, label, help), read: () => input.checked, input };
  }

  const { multi, split } = layout(arg);
  let input;
  if (arg.choices.length && !multi && arg.num_args.max === 1) {
    const hint = arg.default.length ? `Default (${arg.default.join(" ")})` : "Not set";
    input = el("select", { id }, el("option", { value: "", textContent: arg.required ? "Choose…" : hint }));
    for (const choice of arg.choices) input.append(el("option", { value: choice, textContent: choice }));
  } else if (multi) {
    input = el("textarea", { id, spellcheck: false, placeholder: split === "word" ? `${name}, one group per line` : `${name}, one per line` });
  } else {
    const placeholder = arg.default.length ? `Default: ${arg.default.join(" ")}` : split === "word" ? name : "";
    input = el("input", { type: "text", id, placeholder, spellcheck: false });
    if (arg.type === "integer" || arg.type === "number") input.inputMode = "decimal";
  }
  input.required = arg.required;
  input.className = arg.type === "path" ? "mono" : "";
  const label = el("label", { htmlFor: id }, title);
  if (arg.required) label.append(el("span", { className: "required", textContent: " *", "aria-hidden": "true" }));
  if (arg.position == null && arg.value_names.length) label.append(el("span", { className: "flag mono", textContent: name }));
  if (arg.choices.length && multi) help && help.append(`\nOne of: ${arg.choices.join(", ")}`);
  const control = arg.type === "path" ? pathField(input) : input;
  return { arg, node: el("div", { className: "field" }, label, control, help), read: () => input.value, input };
}

function show(command) {
  for (const button of byId("commands").querySelectorAll("button")) {
    button.setAttribute("aria-current", String(button.dataset.path === command.path.join(" ")));
  }
  const fields = command.arguments.filter(isShown).map((arg, i) => field(arg, `f${i}`));
  const main = fields.filter((f) => f.arg.position != null || f.arg.required);
  main.sort((a, b) => (a.arg.position ?? 1e9) - (b.arg.position ?? 1e9));
  const optional = fields.filter((f) => !main.includes(f));

  const preview = el("pre", {});
  const run = el("button", { type: "submit", className: "action primary", textContent: "Run" });
  const cancel = el("button", { type: "button", className: "action", textContent: "Cancel", disabled: true });
  const copy = el("button", { type: "button", className: "action", textContent: "Copy command" });
  const status = el("span", { className: "status", role: "status" });
  const output = el("pre", { id: "output", hidden: true });
  const form = el("form", { noValidate: false, autocomplete: "off" });
  form.append(...main.map((f) => f.node));
  if (optional.length) {
    const details = el("details", {}, el("summary", { textContent: `Options (${optional.length})` }));
    details.append(...optional.map((f) => f.node));
    form.append(details);
  }
  form.append(el("div", { className: "bar" }, run, cancel, copy, status), el("h2", { textContent: "Command" }), preview, output);

  const render = () => {
    const tokens = commandLine(command, fields);
    preview.textContent = ["terrio", command.path[1], ...tokens].map(shellQuote).join(" ");
  };
  form.addEventListener("input", render);
  form.addEventListener("change", render);
  render();

  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(preview.textContent);
      status.textContent = "Copied.";
    } catch {
      status.textContent = "Could not reach the clipboard.";
    }
  });

  let controller = null;
  cancel.addEventListener("click", () => controller && controller.abort());
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    controller = new AbortController();
    run.disabled = true;
    cancel.disabled = false;
    status.className = "status";
    status.textContent = "Running…";
    output.hidden = true;
    const started = performance.now();
    try {
      const response = await fetch("/api/run", {
        method: "POST",
        headers,
        signal: controller.signal,
        body: JSON.stringify({ name: command.path[1], arguments: { args: commandLine(command, fields) } }),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || response.statusText);
      const seconds = ((performance.now() - started) / 1000).toFixed(1);
      output.textContent = result.content.map((c) => c.text).join("\n");
      output.classList.toggle("bad", result.isError);
      output.hidden = false;
      status.className = result.isError ? "status bad" : "status";
      status.textContent = `${result.isError ? "Failed" : "Finished"} in ${seconds} s.`;
    } catch (error) {
      status.className = error.name === "AbortError" ? "status" : "status bad";
      status.textContent = error.name === "AbortError" ? "Cancelled: the command was stopped." : `Error: ${error.message}`;
    } finally {
      run.disabled = false;
      cancel.disabled = true;
    }
  });

  const content = byId("content");
  content.replaceChildren(el("h1", { textContent: command.path.slice(1).join(" ") }), el("p", { className: "about", textContent: command.description }), form);
  content.parentElement.scrollTop = 0;
}

function renderList(all, query) {
  const needle = query.trim().toLowerCase();
  const items = all.filter((c) => !needle || c.path.join(" ").includes(needle) || c.aliases.some((a) => a.includes(needle)) || c.description.toLowerCase().includes(needle));
  const current = byId("commands").querySelector('[aria-current="true"]')?.dataset.path;
  byId("commands").replaceChildren(...items.map((command) => {
    const path = command.path.join(" ");
    const button = el("button", { type: "button", textContent: command.path.slice(1).join(" "), title: command.description.split("\n")[0], "aria-current": String(path === current) });
    button.dataset.path = path;
    button.addEventListener("click", () => show(command));
    return el("li", {}, button);
  }));
}

function formatSize(bytes) {
  if (bytes == null) return "";
  const units = ["B", "KB", "MB", "GB", "TB"];
  const power = Math.min(Math.floor(Math.log(Math.max(bytes, 1)) / Math.log(1024)), units.length - 1);
  return `${(bytes / 1024 ** power).toFixed(power ? 1 : 0)} ${units[power]}`;
}

let browsing = { path: "", parent: null };
let separator = "/";
function choose(path) {
  if (browseTarget.tagName === "TEXTAREA" && browseTarget.value.trim()) browseTarget.value = `${browseTarget.value.trimEnd()}\n${path}`;
  else browseTarget.value = path;
  browseTarget.dispatchEvent(new Event("input", { bubbles: true }));
  byId("browse").close();
}

async function browseTo(path) {
  const list = byId("browse-list");
  try {
    browsing = await api("/api/list", { path });
  } catch (error) {
    byId("browse-path").textContent = error.message;
    return;
  }
  byId("browse-path").textContent = browsing.path;
  byId("browse-up").disabled = !browsing.parent;
  list.replaceChildren(...browsing.entries.map((entry) => {
    const full = browsing.path.endsWith(separator) ? browsing.path + entry.name : browsing.path + separator + entry.name;
    const button = el("button", { type: "button" }, el("span", { textContent: entry.dir ? `${entry.name}${separator}` : entry.name }), el("span", { className: "size", textContent: formatSize(entry.size) }));
    button.addEventListener("click", () => (entry.dir ? browseTo(full) : choose(full)));
    return el("li", {}, button);
  }));
  list.scrollTop = 0;
}

function openBrowser(input) {
  browseTarget = input;
  const last = input.value.trim().split("\n").pop();
  const cut = last ? last.lastIndexOf(separator) : -1;
  byId("browse").showModal();
  browseTo(cut > 0 ? last.slice(0, cut) : browsing.path);
}

byId("browse-up").addEventListener("click", () => browsing.parent && browseTo(browsing.parent));
byId("browse-folder").addEventListener("click", () => choose(browsing.path));
byId("browse-close").addEventListener("click", () => byId("browse").close());

(async () => {
  try {
    const { catalog, cwd, separator: sep } = await api("/api/catalog");
    separator = sep;
    byId("version").textContent = `v${catalog.version}`;
    byId("cwd").textContent = cwd;
    const all = leaves(catalog.command).sort((a, b) => a.path.join(" ").localeCompare(b.path.join(" ")));
    byId("search").addEventListener("input", (event) => renderList(all, event.target.value));
    renderList(all, "");
    show(all.find((c) => c.name === "info") || all[0]);
  } catch (error) {
    byId("startup").textContent = `Could not start: ${error.message}. Open the address that \`terrio ui\` printed.`;
    byId("startup").classList.add("bad");
  }
})();
</script>
</body>
</html>
