[package]
name = "terrio-crs"
version = "0.2.1"
description = "Coordinate reference systems and transformations in Rust, with EPSG/ESRI/IAU tables and datum grids"
readme = "README.md"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["gis", "geospatial", "crs", "projection", "coordinates"]
categories = ["science::geo"]

[dependencies]
wbprojection = { workspace = true, optional = true }
geographiclib-rs.workspace = true
serde.workspace = true
# PROJJSON: written with PROJ's key order (`preserve_order`), and read.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
thiserror.workspace = true
tiff.workspace = true
ruzstd.workspace = true
rayon.workspace = true

[features]
default = []
# Zstandard TIFF grids, with the zstd C library (off by default: the crate is otherwise pure Rust).
# PROJ's grids are DEFLATE-compressed.
libzstd = ["tiff/zstd"]
# Additional projection methods and legacy identification through wbprojection.
wbprojection-fallback = ["dep:wbprojection"]
# A transport supplied by an embedding application; no networking dependency.
grid-transport = []

[dev-dependencies]
tempfile.workspace = true
