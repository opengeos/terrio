[package]
name = "terrio"
description = "Pure-Rust geospatial raster, vector and point cloud data I/O: read, write, convert and reproject GIS formats without C dependencies"
readme = "../../README.md"
documentation = "https://docs.rs/terrio"
keywords = ["gis", "geospatial", "raster", "vector", "point-cloud"]
categories = ["science::geo", "parser-implementations", "encoding"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
# The GDAL backend's API is documented too: gdal-sys builds docs without GDAL installed.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
wbraster.workspace = true
wbvector.workspace = true
wbprojection.workspace = true
thiserror.workspace = true
serde.workspace = true
# Keeps JSON object keys (properties, fields) in file order, and parses numbers exactly.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip", "raw_value"] }
zip.workspace = true
tiff.workspace = true
flatgeobuf.workspace = true
flatbuffers.workspace = true
parquet.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-ipc.workspace = true
arrow-buffer.workspace = true
bytes.workspace = true
quick-xml.workspace = true
osmpbfreader.workspace = true
half.workspace = true
flate2.workspace = true
weezl.workspace = true
png.workspace = true
lz4_flex.workspace = true
ruzstd.workspace = true
netcdf-reader.workspace = true
hdf5-reader.workspace = true
jpeg-decoder.workspace = true
laz.workspace = true
e57.workspace = true
delaunator.workspace = true
jpeg-encoder.workspace = true
image-webp.workspace = true
# JPEG 2000, in WebAssembly builds too (see `drivers::jp2` for the allocator it links against).
openjp2.workspace = true
lerc-reader.workspace = true
lerc-core.workspace = true
jxl-oxide.workspace = true
rusty_av1d.workspace = true
lzma-rust2.workspace = true

# The optional GDAL backend: opens what GDAL can when terrio has no driver for it. Needs GDAL
# (3.4 or later) installed, found with pkg-config or GDAL_HOME.
gdal = { workspace = true, optional = true }
gdal-sys = { workspace = true, optional = true }

[features]
default = []
## Open any format GDAL reads, through the same data model, when terrio has no driver for it.
gdal = ["dep:gdal", "dep:gdal-sys"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memmap2.workspace = true
zstd.workspace = true
tempfile.workspace = true
ureq.workspace = true
hmac.workspace = true
sha2.workspace = true
rayon.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
