[package]
name = "terrio"
description = "Pure-Rust geospatial raster and vector data I/O"
readme = "../../README.md"
keywords = ["gis", "geospatial", "raster", "vector", "geotiff"]
categories = ["science::geo", "parser-implementations"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
wbraster.workspace = true
wbvector.workspace = true
wbprojection.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
tiff.workspace = true
half.workspace = true
flate2.workspace = true
weezl.workspace = true
png.workspace = true
lz4_flex.workspace = true
ruzstd.workspace = true
netcdf-reader.workspace = true
jpeg-decoder.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# OpenJPEG's port is built as a C-ABI library too, which does not link for wasm32.
openjp2.workspace = true
zstd.workspace = true
tempfile.workspace = true
ureq.workspace = true
hmac.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
