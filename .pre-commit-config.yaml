repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: \.geojson$
      - id: end-of-file-fixer
        # Generated by cargo-about (about.toml), with the licence texts as their authors wrote them.
        exclude: ^LICENSE-THIRD-PARTY\.md$
      - id: trailing-whitespace
        exclude: ^LICENSE-THIRD-PARTY\.md$
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        files: ^python/
      - id: ruff-format
        files: ^python/
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
