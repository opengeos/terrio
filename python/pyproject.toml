[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "terrio"
dynamic = ["version"]
description = "Geospatial raster, vector and point cloud data I/O in Rust, without installing GDAL"
readme = "README.md"
license = "MIT AND MPL-2.0"
requires-python = ">=3.10"
authors = [{ name = "Qiusheng Wu", email = "giswqs@gmail.com" }]
keywords = ["gis", "geospatial", "raster", "vector", "geotiff", "gdal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["numpy>=1.21", "affine>=2.3"]

[project.optional-dependencies]
geopandas = ["geopandas>=0.14"]
test = ["pytest>=7"]
# For terrio.rio.plot.
plot = ["matplotlib>=3.5"]
# For terrio.xarray (dask for chunked arrays); interpolate_na also needs scipy.
xarray = ["xarray>=2024.1", "dask[array]>=2024.1"]

[project.scripts]
terrio = "terrio.__main__:main"
terrio-rio = "terrio.rio.cli:main"

[project.entry-points."xarray.backends"]
terrio = "terrio.xarray._backend:TerrioBackendEntrypoint"

[project.urls]
Repository = "https://github.com/opengeos/terrio"
Issues = "https://github.com/opengeos/terrio/issues"

[tool.maturin]
module-name = "terrio._terrio"
python-source = "python"
manifest-path = "Cargo.toml"
# The notices at the root of the sdist too, where PyPI looks for the License-File entries of its
# metadata (maturin leaves them in python/, beside this file, which it moves to the root).
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
    { path = "LICENSE-THIRD-PARTY.md", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]

[tool.ruff.lint.isort]
known-first-party = ["terrio"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
