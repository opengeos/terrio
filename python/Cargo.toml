[package]
name = "terrio-py"
description = "Python bindings for terrio"
publish = false
version.workspace = true
edition.workspace = true
# Bundles terrio, whose point cloud eigensolver is MPL-2.0.
# Apache-2.0 for the coverage-weighted median adapted from exactextract.
license = "MIT AND MPL-2.0 AND Apache-2.0"
rust-version.workspace = true
repository.workspace = true

[lib]
name = "_terrio"
crate-type = ["cdylib"]
# The extension module links to Python only when it is loaded: built by maturin, tested by pytest.
test = false
doctest = false

[features]
## The optional GDAL backend (`terrio/gdal`): `maturin build --features gdal`, with GDAL 3.4 or
## later installed where pkg-config (or GDAL_HOME) finds it.
gdal = ["terrio/gdal", "terrio-cli/gdal"]

[dependencies]
terrio.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"
wbraster.workspace = true
wbvector.workspace = true
serde_json.workspace = true
serde.workspace = true
# The Arrow C data and stream interfaces, for the Arrow PyCapsule interface.
arrow-array = { workspace = true, features = ["ffi"] }

# `madvise` for the allocator that backs large buffers with huge pages (`hugepage_alloc`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The `terrio` command (`terrio.__main__`); not in the Pyodide wheel, where there is no shell.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
terrio-cli.workspace = true
