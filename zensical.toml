[project]
site_name = "terrio"
site_description = "Pure-Rust geospatial raster, vector and point cloud data I/O: read, write, convert and reproject geospatial formats without C dependencies"
site_author = "opengeos"
site_url = "https://terrio.opengeos.org"
repo_url = "https://github.com/opengeos/terrio"
repo_name = "opengeos/terrio"
extra_css = ["stylesheets/playground.css"]
extra_javascript = ["javascripts/playground.js"]
copyright = "terrio is released under the MIT License. The copyright in the code and data it adapts from GDAL, PROJ, PDAL and other projects remains with their authors; see <a href=\"https://github.com/opengeos/terrio/blob/main/NOTICE\">NOTICE</a>."

nav = [
  { "Home" = "index.md" },
  { "Why terrio?" = "why-terrio.md" },
  { "Installation" = "installation.md" },
  { "Getting Started" = "getting-started.md" },
  { "Playground" = "playground.md" },
  { "Notebooks" = "notebooks.md" },
  { "Command Line" = "cli.md" },
  { "Vector SQL" = "sql.md" },
  { "AI Agents (MCP)" = "mcp.md" },
  { "Formats" = "formats.md" },
  { "Multidimensional Arrays" = "multidim.md" },
  { "Point Clouds" = "point-clouds.md" },
  { "HEC-RAS" = "hecras.md" },
  { "Remote Data" = "remote-data.md" },
  { "Coordinate Systems" = "crs.md" },
  { "Coming from GDAL" = "gdal.md" },
  { "Coming from rasterio" = "rasterio.md" },
  { "Rust Library" = "rust.md" },
  { "Python" = "python.md" },
  { "xarray" = "xarray.md" },
  { "JavaScript" = "javascript.md" },
  { "Testing Against GDAL" = "testing.md" },
  { "Conformance" = "conformance.md" },
  { "Benchmarks" = "benchmarks.md" },
  { "Architecture" = "architecture.md" },
  { "Contributing" = "contributing.md" },
  { "Acknowledgements" = "acknowledgements.md" },
  { "How to Cite" = "citation.md" },
  { "Roadmap" = "roadmap.md" },
  { "Report Issues" = "https://github.com/opengeos/terrio/issues" },
]

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/favicon.png"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
# The roadmap page includes ROADMAP.md from the repository root.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
