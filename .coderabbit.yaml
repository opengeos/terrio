# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    enabled: true
    # Review a pull request when it opens, not again on every push: incremental
    # reviews exhaust the free OSS quota. Comment `@coderabbitai review` to re-review.
    auto_incremental_review: false
    drafts: false
    ignore_title_keywords: ["Release"]
  # Approve a pull request once its review has no open comments. A repository file
  # replaces the app's settings, which had approvals on, so this restores them.
  auto_approvals:
    enabled: true
