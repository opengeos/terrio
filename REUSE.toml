precedence = "override"
SPDX-FileCopyrightText = "GDAL contributors"
SPDX-License-Identifier = "MIT"

# GRIB2 tables: GDAL's GRIB2 tables (frmts/grib/data, GDAL v3.12.2), merged from NOAA's degrib
# tables (public domain) and the WMO's GRIB2 tables (wmo-im/GRIB2, MIT).
[[annotations]]
path = "crates/terrio/data/grib2.tsv.zst"
precedence = "override"
SPDX-FileCopyrightText = ["Copyright © 2020-2024", "Copyright (C) 2021 Even Rouault", "Copyright (c) 2026 Qiusheng Wu and Terrio contributors"]
SPDX-License-Identifier = "MIT"

# GRIB1 tables: degrib's GRIB1 parameter and level tables (frmts/grib/degrib/degrib/grib1tab.cpp,
# GDAL v3.12.1), NOAA MDL code in the public domain (see GDAL's LICENSE.TXT), extracted by
# gen_grib1_tables.py. The source file carries no copyright line.
[[annotations]]
path = "crates/terrio/src/drivers/grib/grib1.tsv.zst"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Qiusheng Wu and Terrio contributors"
SPDX-License-Identifier = "MIT"

# The EPSG Geodetic Parameter Dataset, owned by IOGP, through PROJ 9.8.1 and GDAL.
[[annotations]]
path = [
    "crates/terrio-crs/data/epsg.tsv.zst",
    "crates/terrio-crs/data/epsg_vertical.tsv.zst",
    "crates/terrio-crs/data/point_motion.tsv",
]
precedence = "override"
SPDX-FileCopyrightText = ["International Association of Oil & Gas Producers (IOGP)", "Copyright (c) 2026 Qiusheng Wu and Terrio contributors"]
SPDX-License-Identifier = "LicenseRef-EPSG AND MIT"

# What PROJ's database adds to the PROJJSON of EPSG CRSs: the EPSG Geodetic Parameter Dataset
# v12.029, owned by IOGP, through PROJ 9.7.1's proj.db (scripts/gen_projjson_table.py).
[[annotations]]
path = "crates/terrio-crs/src/projjson_db.tsv.zst"
precedence = "override"
SPDX-FileCopyrightText = ["International Association of Oil & Gas Producers (IOGP)", "Copyright (c) 2026 Qiusheng Wu and Terrio contributors"]
SPDX-License-Identifier = "LicenseRef-EPSG AND MIT"

# EPSG datums with the Esri datum names (Esri projection engine data, Apache-2.0, via PROJ 9.7.1).
[[annotations]]
path = "crates/terrio-crs/data/datums.tsv.zst"
precedence = "override"
SPDX-FileCopyrightText = ["International Association of Oil & Gas Producers (IOGP)", "Copyright © 2010-2025 Esri", "Copyright (c) 2026 Qiusheng Wu and Terrio contributors"]
SPDX-License-Identifier = "LicenseRef-EPSG AND Apache-2.0 AND MIT"

[[annotations]]
path = "crates/terrio-crs/data/esri.tsv.zst"
precedence = "override"
SPDX-FileCopyrightText = ["Copyright © 2010-2025 Esri", "International Association of Oil & Gas Producers (IOGP)", "Copyright (c) 2026 Qiusheng Wu and Terrio contributors"]
SPDX-License-Identifier = "Apache-2.0 AND LicenseRef-EPSG AND MIT"

# IAU_2015 definitions from PROJ 9.8.1's data/sql/iau.sql (scripts/build_db_from_iau.py).
[[annotations]]
path = ["crates/terrio-crs/data/iau.tsv.zst", "crates/terrio-crs/data/iau-source.json"]
precedence = "override"
SPDX-FileCopyrightText = ["Copyright (c) 2021, Hobu Inc", "Copyright (c) 2026 Qiusheng Wu and Terrio contributors"]
SPDX-License-Identifier = "MIT"

# HEC-RAS files from ras-commander-fast-hdf, unchanged.
[[annotations]]
path = [
    "crates/terrio/tests/data/hecras/coverage_mesh.h5",
    "crates/terrio/tests/data/hecras/coverage_mesh_nogroups.h5",
    "crates/terrio/tests/data/hecras/coverage_mesh_nogeometry.h5",
    "crates/terrio/tests/data/hecras/pipes.h5",
    "crates/terrio/tests/data/hecras/terrain.h5",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2024 CLB Engineering Corporation"
SPDX-License-Identifier = "MIT"

# HEC-RAS files Terrio derived from the ras-commander-fast-hdf files (see hecras/README.md).
[[annotations]]
path = [
    "crates/terrio/tests/data/hecras/results_mesh_xs.h5",
    "crates/terrio/tests/data/hecras/results_two_areas.h5",
    "crates/terrio/tests/data/hecras/large_projection.h5",
    "crates/terrio/tests/data/hecras/large_root_attribute.h5",
]
precedence = "override"
SPDX-FileCopyrightText = ["Copyright (c) 2024 CLB Engineering Corporation", "Copyright (c) 2026 Qiusheng Wu and Terrio contributors"]
SPDX-License-Identifier = "MIT"

# Numeric fixtures from rust-proj-capability, which carries no license yet (see NOTICE).
[[annotations]]
path = "crates/terrio-crs/tests/data/*_benchmark.json"
precedence = "override"
SPDX-FileCopyrightText = "Michael Sumner"
SPDX-License-Identifier = "LicenseRef-rust-proj-capability"
