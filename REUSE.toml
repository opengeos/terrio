version = 1
SPDX-PackageName = "terrio"
SPDX-PackageDownloadLocation = "https://github.com/opengeos/terrio"

# Terrio's own files. Files derived from other projects carry their own SPDX headers, which
# take precedence: the upstream copyright lines, the licences and the sources they derive from.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Copyright (c) 2026 Qiusheng Wu and Terrio contributors"
SPDX-License-Identifier = "MIT"

# The notices reproduce other projects' copyright lines and licence texts.
[[annotations]]
path = ["NOTICE", "crates/terrio/NOTICE", "crates/terrio-crs/NOTICE", "LICENSE-THIRD-PARTY.md"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Qiusheng Wu and Terrio contributors"
SPDX-License-Identifier = "MIT"

# GRIB files from GDAL's test suite (autotest/gdrivers/data/grib, GDAL v3.13.3), unchanged.
# The files carry no copyright line; GDAL's test data is distributed under GDAL's licence.
[[annotations]]
path = [
    "crates/terrio/tests/data/grib/MANAL_2023030103_fake_wrong_grid_origin_latitude.grb2",
    "crates/terrio/tests/data/grib/MRMS_EchoTop_18_00.50_20161015-133230.grib2",
    "crates/terrio/tests/data/grib/Sample_QuikSCAT.grb",
    "crates/terrio/tests/data/grib/albers_equal_area.grb2",
    "crates/terrio/tests/data/grib/byte_wrong_earth_shape.grib2",
    "crates/terrio/tests/data/grib/ds.mint.bin",
    "crates/terrio/tests/data/grib/gfs.t06z.pgrb2.1p0.grib2",
    "crates/terrio/tests/data/grib/ieee754_single.grb2",
    "crates/terrio/tests/data/grib/jpeg2000_nbits_zero_decimal_scaled.grb2",
    "crates/terrio/tests/data/grib/laea_with_negative_longitudes_issue_7456.grib2",
    "crates/terrio/tests/data/grib/lambert_azimuthal_equal_area.grb2",
    "crates/terrio/tests/data/grib/lambert_conformal_conic.grb2",
    "crates/terrio/tests/data/grib/parameter_in_wmo_tables_only.grb2",
    "crates/terrio/tests/data/grib/png_nbits_zero_decimal_scaled.grb2",
    "crates/terrio/tests/data/grib/polar_stereographic.grb2",
    "crates/terrio/tests/data/grib/rotated_pole.grb2.begin",
