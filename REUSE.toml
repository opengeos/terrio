    "crates/terrio/tests/data/grib/spatial_differencing_order_1.grb2",
    "crates/terrio/tests/data/grib/subgrids_reuse_bitmap.grib2",
    "crates/terrio/tests/data/grib/template_4_48.grb2",
    "crates/terrio/tests/data/grib/template_4_65535.grb2",
    "crates/terrio/tests/data/grib/twenty-se27w.2017102006.hwrfsat.core.0p02.f000_truncated.grb2",
    "crates/terrio/tests/data/grib/two_bands_with_bitmap.grib2",
