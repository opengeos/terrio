[package]
name = "terrio-js"
description = "WebAssembly bindings for terrio"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Without terrio's default features: the formats come from this crate's own features below.
terrio = { path = "../crates/terrio", default-features = false, features = ["geotiff"] }
wbraster.workspace = true
wbvector.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# The thread pool of the threaded module (the `threads` feature), whose main thread spins rather
# than blocks while it waits (browsers forbid blocking their main thread).
rayon = { workspace = true, optional = true, features = ["web_spin_lock"] }
serde.workspace = true
serde_json.workspace = true

# The formats besides GeoTIFF/COG, GeoJSON and the other text vector formats, Shapefile, CSV and
# Esri ASCII grids, which are always built. `full`, the default, is the npm package `terrio-js`;
# `core` is its lighter build (`terrio-js/core`), without the heaviest codecs.
[features]
default = ["full"]
full = ["cad", "core", "parquet", "avif", "netcdf-hdf5", "osm", "jp2", "pointcloud", "zarr", "grib", "hecras"]
core = ["flatgeobuf", "sqlite", "tiles", "lzma", "lerc"]
cad = ["terrio/cad"]
parquet = ["terrio/parquet"]
avif = ["tiles", "terrio/avif"]
netcdf-hdf5 = ["terrio/netcdf-hdf5"]
osm = ["terrio/osm"]
lzma = ["terrio/lzma"]
flatgeobuf = ["terrio/flatgeobuf"]
jp2 = ["terrio/jp2"]
grib = ["terrio/grib"]
hecras = ["netcdf-hdf5", "terrio/hecras"]
lerc = ["terrio/lerc"]
pointcloud = ["terrio/pointcloud"]
tiles = ["sqlite", "terrio/tiles"]
zarr = ["terrio/zarr"]
sqlite = ["terrio/sqlite"]
# `terrio-js/threads`: every format, and `initThreadPool`. It builds only for WebAssembly with
# threads (nightly Rust, `-C target-feature=+atomics,+bulk-memory` and `-Z build-std`): see
# js/build.mjs.
threads = ["full", "dep:rayon"]

# The memory64 module (wasm64): ahash seeds its hash maps with getrandom, which has no backend
# there but a custom one (`--cfg getrandom_backend="custom"`, see js/build.mjs), defined in lib.rs.
[target.'cfg(target_arch = "wasm64")'.dependencies]
getrandom = "0.4"

# The npm package's build (`node js/build.mjs`, the `wasm-release` profile of the workspace).
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Oz"]
