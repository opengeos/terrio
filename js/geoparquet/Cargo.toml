[package]
name = "terrio-js-geoparquet"
description = "terrio-js/geoparquet: GeoParquet files read by row group and bbox over HTTP, the lean WebAssembly module"
publish = false
version.workspace = true
edition.workspace = true
# This unpublished crate's source is MIT; the outer npm package declares the
# bundle's compound license and ships all dependency notices.
license = "MIT"
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# GeoParquet alone: the CRS engine is left out by `read_geoparquet_sparse_epsg_only`.
terrio = { path = "../../crates/terrio", default-features = false, features = ["parquet"] }
terrio-js-fetch = { path = "../fetch" }
# The GeoJSON of terrio-js's `toGeoJSON` (js/src/geojson.rs).
wbvector.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# The npm package's build (js/build.mjs, the `wasm-release` profile of the workspace).
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Oz"]
