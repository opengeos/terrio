[package]
name = "terrio-js-zarr"
description = "terrio-js/zarr: Zarr arrays read by window over HTTP, the lean WebAssembly module"
publish = false
version.workspace = true
edition.workspace = true
# This unpublished crate's source is MIT; the outer npm package declares the
# bundle's compound license and ships all dependency notices.
license = "MIT"
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Zarr alone: the CRS engine is left out by `ZarrArray::open_objects_epsg_only`.
terrio = { path = "../../crates/terrio", default-features = false, features = ["zarr"] }
terrio-js-fetch = { path = "../fetch" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# The npm package's build (js/build.mjs, the `wasm-release` profile of the workspace).
[package.metadata.wasm-pack.profile.custom]
wasm-opt = ["-Oz"]
