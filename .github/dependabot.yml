version: 2
updates:
  # The Rust workspace (library, CLI, Python and JS bindings share one Cargo.lock). Minor and
  # patch updates come as one weekly PR; major updates come one per PR. The ignored major
  # updates below require coordinated format dependencies or a deliberate public API change.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    # Major versions taken deliberately rather than as they come out: parquet and arrow move together,
    # and terrio re-exports arrow-array and arrow-schema (`terrio::arrow`), so their majors change
    # terrio's API; flatbuffers is the version flatgeobuf's generated code is built with, and moves
    # when flatgeobuf does.
    ignore:
      - dependency-name: "parquet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "arrow*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "flatbuffers"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The base images in the Dockerfile, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
