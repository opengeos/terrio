name: Release dry run

# Builds and checks everything a release publishes, without publishing: the wheels for every
# platform, the source distribution, the Pyodide wheel and the command-line binaries
# (release-build.yml, as the release builds them), the Docker image, the crates as `cargo publish`
# packages and verifies them, the npm package, and that LICENSE-THIRD-PARTY.md is up to date.
# Run by hand before tagging a release (Actions > Release dry run > Run workflow).
# Pull requests use the normal CI build, API, Python and WASM packaging checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/release-build.yml

  docker:
    # A called workflow's jobs cannot have more than its caller grants; nothing is pushed here.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      push: false

  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # All three crates at once, so terrio-cli is verified against the terrio being released rather
      # than the version on crates.io.
      - name: Package and verify terrio-crs, terrio and terrio-cli
        run: cargo publish --dry-run --locked -p terrio-crs -p terrio -p terrio-cli

  # LICENSE-THIRD-PARTY.md, which the packages ship, lists the dependencies being released.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          # Pinned: the generated file depends on cargo-about's version and license data.
          tool: cargo-about@0.9.2
      - name: Check that LICENSE-THIRD-PARTY.md is up to date
        run: |
          cargo about generate --locked --all-features --fail about.hbs -o LICENSE-THIRD-PARTY.md
          git diff --exit-code LICENSE-THIRD-PARTY.md

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The threaded and memory64 modules (js/build.mjs): the nightly it pins, with the standard
      # library's sources.
      # Installed first: the last toolchain installed is the default (stable).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: nightly-2026-10-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-pack@0.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The npm release.yml publishes with, so that a failing install shows here first.
      - run: npm install -g npm@12.2.2 && npm --version
      - name: Build the package as the release does
        run: |
          node js/build.mjs
          node .github/scripts/npm-notices.mjs js/pkg
      - name: Check its name and version, and pack it
        working-directory: js/pkg
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          expected=$(cargo metadata --no-deps --format-version 1 --manifest-path ../../Cargo.toml | jq -r '.packages[] | select(.name == "terrio") | .version')
          echo "$name $version (terrio $expected)"
          test "$name" = terrio-js
          test "$version" = "$expected"
          npm pack --dry-run
