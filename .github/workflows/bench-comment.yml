name: bench comment

# Posts the results of bench.yml on the pull request as one comment, updated in place, and sets
# the `perf-regression` label when a benchmark runs 10% or more instructions or estimated cycles.
# It runs from main with a write token, so it never checks out or runs the pull request's code:
# the artifact it reads was written by that code (a fork can change bench.yml), and is only
# posted as text, without any line naming the performance review's marker.
#
# On a regression it also dispatches the performance-only review of claude-code-review.yml for the
# pull request, which explains the slower benchmarks under the table of this comment. It is
# dispatched from a separate job that alone holds `actions: write`, because the label added here
# with GITHUB_TOKEN starts no workflow. Only for the authors that review covers automatically, so
# a first-time contributor's edited bench.yml cannot spend reviews; a maintainer can still
# dispatch one, or add `perf-regression` by hand.

on:
  workflow_run:
    workflows: [bench]
    types: [completed]

permissions: {}

# One posting job at a time per pull request branch, so that two never both create the comment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      pull-requests: write
    outputs:
      dispatch: ${{ steps.post.outputs.dispatch }}
    steps:
      # Absent when bench.yml skipped the benchmarks.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bench
          path: bench
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: post
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ ! -f bench/pr-number.txt ] || [ ! -f bench/bench.md ]; then
            echo "No benchmark results to post."
            exit 0
          fi
          pr=$(head -c 20 bench/pr-number.txt | tr -d '[:space:]')
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number."
            exit 1
          fi
          # The artifact names the pull request: the run must have benchmarked its head, from its
          # repository and branch (another fork can push the same public commit).
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" -q '[.head.sha, .head.repo.full_name, .head.ref] | join(" ")')
          if [ "$head" != "$RUN_HEAD_SHA $RUN_HEAD_REPO $RUN_HEAD_BRANCH" ]; then
            echo "Pull request #$pr is not $RUN_HEAD_REPO:$RUN_HEAD_BRANCH at $RUN_HEAD_SHA: nothing posted."
            exit 0
          fi
          marker='<!-- terrio-bench -->'
          # A comment holds at most 65536 characters: 40000 here leaves room for the performance
          # review's explanation. Invalid UTF-8 from the cut is dropped, and so is any line naming
          # the review's once-per-head marker, which only claude-code-review.yml may write.
          { echo "$marker"
            head -c 40000 bench/bench.md | iconv -c -f UTF-8 -t UTF-8 | grep -v claude-perf-review || true
          } > body.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F body=@body.md > /dev/null
          fi
          if grep -q '^<!-- terrio-bench: regression -->$' body.md; then
            gh label create perf-regression --color D93F0B \
              --description "A benchmark runs 10% or more CPU instructions or estimated cycles than on main" 2>/dev/null || true
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/labels" -f "labels[]=perf-regression" > /dev/null
            assoc=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" -q .author_association)
            case "$assoc" in
              OWNER | MEMBER | COLLABORATOR | CONTRIBUTOR) echo "dispatch=$pr" >> "$GITHUB_OUTPUT" ;;
              *) echo "No automatic performance review for a $assoc author." ;;
            esac
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$pr/labels/perf-regression" > /dev/null 2>&1 || true
          fi

  # Dispatching needs `actions: write`, which also allows cancelling or re-running workflow runs
  # and has no narrower scope. It is kept to this job, which reads no artifact and runs nothing
  # from the pull request: only the number the comment job validated.
  dispatch:
    needs: comment
    if: needs.comment.outputs.dispatch != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.comment.outputs.dispatch }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Invalid pull request number"; exit 1; }
          gh workflow run claude-code-review.yml -f "pr=$PR" \
            || echo "::warning::Could not dispatch the performance review."
