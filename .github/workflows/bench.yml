name: bench

# CPU instructions, estimated cycles (Callgrind) and peak heap (DHAT) of
# crates/terrio/benches/instructions.rs and of the terrio commands of crates/terrio-cli/benches/cases.txt
# (crates/terrio-cli/benches/commands.rs) under Valgrind, on
# the pull request against main (the merge commit's first parent), in the same job. Instruction
# counts repeat within 0.01% between runs, where timings on shared runners vary by 10–30%.
# Informational: the job fails only when a build or a benchmarked command fails, never on a regression. bench-comment.yml
# posts the results, which this job uploads as the `bench` artifact: a pull request from a fork gets
# a read-only token here.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Only Rust sources, build scripts, manifests and build settings change instruction counts. When the file list is
  # unavailable, it runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)'); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$files" | grep -Eq '^(crates/[^/]+/(src|benches)/|crates/[^/]+/(Cargo\.toml|build\.rs)$|Cargo\.(toml|lock)$|\.cargo/|rust-toolchain|\.github/workflows/bench\.yml$|scripts/bench_comment\.py$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Benchmarks skipped: no Rust source or manifest changed."
          fi

  # main is the merge commit's first parent, as the pull request merges into it; `pr` is the merge
  # commit. Each prints the summaries without a baseline: the `comment` job pairs them.
  bench:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        side: [main, pr]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - if: matrix.side == 'main'
        run: git checkout -q --detach HEAD^1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.side }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          # The version of the gungraun dev-dependency (Cargo.toml).
          tool: gungraun-runner@0.20.0
      - run: sudo apt-get update -q && sudo apt-get install -yq valgrind
      - name: Benchmark ${{ matrix.side }}
        env:
          SIDE: ${{ matrix.side }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # Each benchmark as crate/name: crates/<crate>/benches/<name>.rs. Concatenated summaries,
          # which bench_comment.py reads; empty when main has no benchmarks yet.
          for bench in terrio/instructions terrio-cli/commands; do
            crate=${bench%/*} name=${bench#*/}
            if [ -f "crates/$crate/benches/$name.rs" ]; then
              cargo bench -p "$crate" --bench "$name" -- --output-format=json >> "$RUNNER_TEMP/out/$SIDE.json"
            else
              echo "$SIDE has no $name benchmarks yet."
            fi
          done
          touch "$RUNNER_TEMP/out/$SIDE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.side }}
          path: ${{ runner.temp }}/out
          retention-days: 1

  comment:
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/in
          merge-multiple: true
      - name: Write the comment
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git rev-parse HEAD^1)
          mkdir -p "$RUNNER_TEMP/bench"
          python3 scripts/bench_comment.py "$RUNNER_TEMP/in/pr.json" --main "$RUNNER_TEMP/in/main.json" --base "$base" --head "$HEAD_SHA" > "$RUNNER_TEMP/bench/bench.md"
          echo "$PR" > "$RUNNER_TEMP/bench/pr-number.txt"
          cat "$RUNNER_TEMP/bench/bench.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: ${{ runner.temp }}/bench
          retention-days: 7
