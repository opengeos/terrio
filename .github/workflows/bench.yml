name: bench

# CPU instructions, estimated cycles (Callgrind) and peak heap (DHAT) of
# crates/terrio/benches/instructions.rs under Valgrind, on
# the pull request against main (the merge commit's first parent), in the same job. Instruction
# counts repeat within 0.01% between runs, where timings on shared runners vary by 10–30%.
# Informational: the job fails only when a build fails, never on a regression. bench-comment.yml
# posts the results, which this job uploads as the `bench` artifact: a pull request from a fork gets
# a read-only token here.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Only Rust sources, build scripts, manifests and build settings change instruction counts. When the file list is
      # unavailable, it runs.
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)'); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$files" | grep -Eq '^(crates/[^/]+/(src|benches)/|crates/[^/]+/(Cargo\.toml|build\.rs)$|Cargo\.(toml|lock)$|\.cargo/|rust-toolchain|\.github/workflows/bench\.yml$|scripts/bench_comment\.py$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Benchmarks skipped: no Rust source or manifest changed."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
      - if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.changes.outputs.run == 'true'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          # The version of the gungraun dev-dependency (Cargo.toml).
          tool: gungraun-runner@0.20.0
      - if: steps.changes.outputs.run == 'true'
        run: sudo apt-get update -q && sudo apt-get install -yq valgrind
      # The merge commit's first parent is main as the pull request merges into it. The base is
      # built and run first and saved as the `main` baseline, unless it has no benchmarks yet.
      - if: steps.changes.outputs.run == 'true'
        name: Benchmark main
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          head=$(git rev-parse HEAD)
          base=$(git rev-parse HEAD^1)
          echo "HEAD_SHA=$PR_HEAD_SHA" >> "$GITHUB_ENV"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "MERGE_SHA=$head" >> "$GITHUB_ENV"
          git checkout -q --detach "$base"
          if [ -f crates/terrio/benches/instructions.rs ]; then
            cargo bench -p terrio --bench instructions -- --save-baseline=main --output-format=json > "$RUNNER_TEMP/main.json"
          else
            echo "main has no benchmarks yet: the pull request's counts are reported alone."
          fi
          git checkout -q --detach "$head"
      - if: steps.changes.outputs.run == 'true'
        name: Benchmark the pull request
        run: |
          baseline=()
          [ -s "$RUNNER_TEMP/main.json" ] && baseline=(--baseline=main)
          cargo bench -p terrio --bench instructions -- "${baseline[@]}" --output-format=json > "$RUNNER_TEMP/pr.json"
      - if: steps.changes.outputs.run == 'true'
        name: Write the comment
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          python3 scripts/bench_comment.py "$RUNNER_TEMP/pr.json" --base "$BASE_SHA" --head "$HEAD_SHA" > "$RUNNER_TEMP/bench/bench.md"
          echo "$PR" > "$RUNNER_TEMP/bench/pr-number.txt"
          cat "$RUNNER_TEMP/bench/bench.md" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: ${{ runner.temp }}/bench
          retention-days: 7
