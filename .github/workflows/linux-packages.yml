name: Linux packages

# Publishes a release to the Arch User Repository (terrio, built from source, and terrio-bin, the
# release's static binary) and builds it on Fedora COPR (giswqs/terrio). The packaging lives in
# packaging/; only its version changes here. release.yml calls this once the release and its
# binaries are on GitHub; it can also be run by hand for a release (Actions > Linux packages).
# Each channel skips itself when its secret is missing, runs whether or not the other succeeds,
# and fails the workflow when it fails.
#
# Repository secrets:
#   AUR_SSH_PRIVATE_KEY - private SSH key registered on the AUR account (giswqs) that
#                         maintains terrio and terrio-bin
#   COPR_CONFIG         - the copr-cli config block from https://copr.fedorainfracloud.org/api/
#                         (COPR expires API tokens after 180 days)
on:
  workflow_call:
    inputs:
      version:
        description: The release, such as 0.4.1 or v0.4.1
        required: true
        type: string
      release:
        description: The package release (pkgrel, RPM Release) for packaging fixes of a version
        required: false
        type: string
        default: "1"
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false
      COPR_CONFIG:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: The release, such as 0.4.1 or v0.4.1
        required: true
        type: string
      release:
        description: The package release (pkgrel, RPM Release) for packaging fixes of a version
        required: false
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  aur:
    name: AUR (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [terrio-bin, terrio]
    concurrency:
      group: aur-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      - name: Check for the AUR key
        id: key
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: if [ -n "$AUR_KEY" ]; then echo present=true; else echo present=false; fi >> "$GITHUB_OUTPUT"

      # Pinned to a commit, as the job publishes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - name: Set the version
        if: steps.key.outputs.present == 'true'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ inputs.release }}
          PKGBUILD: packaging/aur/${{ matrix.package }}/PKGBUILD
        run: |
          version="${VERSION#v}"
          # Both go into sed and URLs.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release version: $version"; exit 1; }
          [[ "$RELEASE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a package release: $RELEASE"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          sed -i "s/^pkgver=.*/pkgver=$version/; s/^pkgrel=.*/pkgrel=$RELEASE/" "$PKGBUILD"

      - name: Push ${{ matrix.package }} to the AUR
        if: steps.key.outputs.present == 'true'
        # Pinned to a commit: this step receives the AUR key.
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: packaging/aur/${{ matrix.package }}/PKGBUILD
          # The checksums of the release's files, computed from them.
          updpkgsums: true
          commit_username: Qiusheng Wu
          commit_email: giswqs@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.VERSION }}-${{ inputs.release }}
          allow_empty_commits: false

  copr:
    name: Fedora COPR
    runs-on: ubuntu-latest
    concurrency:
      group: copr
      cancel-in-progress: false
    steps:
      - name: Check for the COPR configuration
        id: key
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: if [ -n "$COPR_CONFIG" ]; then echo present=true; else echo present=false; fi >> "$GITHUB_OUTPUT"

      # Pinned to a commit, as the job publishes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false

      - name: Build the source RPM
        if: steps.key.outputs.present == 'true'
        env:
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ inputs.release }}
        run: |
          version="${VERSION#v}"
          # Both go into sed and URLs.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release version: $version"; exit 1; }
          [[ "$RELEASE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a package release: $RELEASE"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          spec=packaging/copr/terrio.spec
          sed -i "s/^Version: .*/Version:        $version/; s/^Release: .*/Release:        $RELEASE%{?dist}/" "$spec"
          # A changelog entry for this version, first, unless the spec has one.
          if ! grep -q -- "- $version-$RELEASE\$" "$spec"; then
            entry="* $(LC_ALL=C date -u '+%a %b %d %Y') Qiusheng Wu <giswqs@gmail.com> - $version-$RELEASE"
            sed -i "/^%changelog/a $entry\n- Release $version.\n" "$spec"
          fi
          src="$HOME/rpmbuild/SOURCES"
          mkdir -p "$src"
          curl -sSfL -o "$src/terrio-$version.tar.gz" "https://github.com/opengeos/terrio/archive/refs/tags/v$version.tar.gz"
          srpm="$(rpmbuild -bs "$spec" --define "_topdir $HOME/rpmbuild" | sed -n 's/^Wrote: //p')"
          [ -n "$srpm" ] || { echo "::error::rpmbuild wrote no source RPM"; exit 1; }
          echo "SRPM=$srpm" >> "$GITHUB_ENV"

      - name: Build it on COPR (giswqs/terrio)
        if: steps.key.outputs.present == 'true'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          # Pinned: this step holds the COPR token.
          pipx install 'copr-cli==2.6'
          mkdir -p ~/.config
          (umask 077; printf '%s\n' "$COPR_CONFIG" > ~/.config/copr)
          # Accept a partial paste of the API page's block: copr-cli needs the section header
          # and copr_url, which are the same for everyone.
          grep -q '^\[copr-cli\]' ~/.config/copr || sed -i '1i [copr-cli]' ~/.config/copr
          grep -q '^copr_url' ~/.config/copr || echo 'copr_url = https://copr.fedorainfracloud.org' >> ~/.config/copr
          # Waits for the build: a chroot that fails fails the job.
          copr-cli build giswqs/terrio "$SRPM"
