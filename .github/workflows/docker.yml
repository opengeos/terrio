name: Docker

# Builds the `terrio` image (Dockerfile) for linux/amd64 and linux/arm64, each on a native runner,
# and publishes it to the GitHub Container Registry as ghcr.io/opengeos/terrio. release.yml calls
# this on version tags (tags X.Y.Z, X.Y and latest); it can also be run by hand (Actions > Docker),
# which from a branch publishes a tag named after the branch. Pull requests changing the image and
# release-dry-run.yml build and check it without publishing. Authenticates with GITHUB_TOKEN, so
# there are no secrets to set up.
on:
  workflow_call:
    inputs:
      push:
        description: Publish the image, rather than only building and checking it
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      push:
        description: Publish the image, rather than only building and checking it
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          tags: terrio:test
      - name: Check the image runs
        run: |
          docker run --rm terrio:test --version
          docker run --rm terrio:test formats > /dev/null
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request' && inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # By digest: the merge job names the two images with one set of tags. Reuses the build above.
      - name: Push
        id: push
        if: github.event_name != 'pull_request' && inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Check the pushed image runs
        if: github.event_name != 'pull_request' && inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker run --rm "$IMAGE@$DIGEST" --version
          docker run --rm "$IMAGE@$DIGEST" formats > /dev/null
      - name: Record the digest
        if: github.event_name != 'pull_request' && inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && inputs.push
        with:
          name: docker-digest-${{ matrix.platform.arch }}
          path: digests/*
          if-no-files-found: error

  merge:
    needs: [build]
    if: github.event_name != 'pull_request' && inputs.push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # latest only for the highest stable release, so that rebuilding an older tag leaves it alone.
      - name: Check for the highest release
        id: highest
        run: |
          highest=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' \
            | sed 's|.*refs/tags/v||' | grep -E '^[0-9.]+$' | sort -V | tail -n 1)
          if [ "$GITHUB_REF_NAME" = "v$highest" ]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ steps.highest.outputs.latest }}
      - name: Publish the multi-platform image
        working-directory: digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do args+=(--tag "$tag"); done <<< "$TAGS"
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      - name: Show the published image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
