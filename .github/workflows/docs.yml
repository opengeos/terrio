name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "ROADMAP.md", "zensical.toml", "requirements_docs.txt", "lite/**", "scripts/test_jupyterlite.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Build docs with Zensical
        run: |
          uv venv --python 3.12
          uv pip install -r requirements_docs.txt
          .venv/bin/zensical build
      - name: Download the latest Pyodide wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern '*pyemscripten*' --dir lite/wheels
      - name: Build the JupyterLite site
        working-directory: lite
        run: |
          uv venv --python 3.12
          uv pip install -r requirements.txt playwright
          .venv/bin/jupyter lite build
      - name: Run the JupyterLite notebooks in a browser
        run: |
          lite/.venv/bin/playwright install --with-deps chromium
          lite/.venv/bin/python scripts/test_jupyterlite.py site/lite
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
