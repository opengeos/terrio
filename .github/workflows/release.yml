name: Release

# On version tags, publishes the Python wheels and source distribution to PyPI, the terrio and
# terrio-cli crates to crates.io, and the WebAssembly package to npm. All three use trusted
# publishing: no API tokens are stored, each registry trusts this workflow and its environment
# (pypi, crates-io, npm).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.platform.os }}, ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          # manylinux2014's cross compiler is too old for ring's ARM assembly.
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64, manylinux: auto }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
          # Built natively on GitHub's Arm64 Windows runner.
          - { os: windows-11-arm, target: aarch64, manylinux: auto }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: python/dist

  # Pyodide (WebAssembly in the browser and Node.js): a wheel for the Python and Emscripten
  # versions of the pinned Pyodide release, tested in Pyodide under Node.js. It is attached to the
  # GitHub release, not published to PyPI.
  pyodide:
    name: wheels (pyodide)
    runs-on: ubuntu-latest
    env:
      PYODIDE_VERSION: "0.29.5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Rust's Emscripten target uses WebAssembly exception handling, as Pyodide 0.28 and later
      # need, by default since Rust 1.93: stable Rust builds the wheel.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - name: Install pyodide-build and the cross-build environment
        run: |
          python -m pip install pyodide-build
          pyodide xbuildenv install "$PYODIDE_VERSION"
          echo "EMSCRIPTEN_VERSION=$(pyodide config get emscripten_version)" >> "$GITHUB_ENV"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Build the wheel
        working-directory: python
        # pyodide-build's default flags are for its pinned nightly toolchain (-Z flags); stable
        # Rust needs only the side-module link flag.
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS: "-C link-arg=-sSIDE_MODULE=2"
        run: pyodide build -o dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the wheel in Pyodide under Node.js
        run: |
          mkdir -p "$RUNNER_TEMP/pyodide" && cd "$RUNNER_TEMP/pyodide"
          npm init -y > /dev/null
          npm install "pyodide@$PYODIDE_VERSION"
          cp "$GITHUB_WORKSPACE/python/tests/pyodide/smoke.mjs" .
          node smoke.mjs "$(ls "$GITHUB_WORKSPACE"/python/dist/*.whl)"
      - uses: actions/upload-artifact@v7
        with:
          name: pyodide-wheel
          path: python/dist/*.whl

  pyodide-release:
    # Once the packages are on PyPI, so that a release never announces a version that is not.
    needs: [pyodide, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pyodide-wheel
          path: dist
      - name: Attach the Pyodide wheel to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --verify-tag --generate-notes
          gh release upload "$tag" dist/*.whl --clobber

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The native wheels and the source distribution (the Pyodide wheel goes to the GitHub
      # release only).
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  crates:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # A version already on crates.io (such as a first release published by hand, before the
      # crates trusted this workflow) is skipped rather than failing the job.
      - name: Publish terrio, then terrio-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "terrio") | .version')
          for crate in terrio terrio-cli; do
            if curl -sf -A "terrio release (https://github.com/opengeos/terrio)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate" --locked
            fi
          done

  npm:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Build the package (browsers, bundlers, and Node.js through init)
        run: |
          wasm-pack build js --release --target web --out-dir pkg --out-name terrio
          cp LICENSE js/pkg/
      - name: Publish unless this version is already on npm
        working-directory: js/pkg
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "terrio-js@$version" version > /dev/null 2>&1; then
            echo "terrio-js $version is already on npm"
          else
            npm publish --access public
          fi
