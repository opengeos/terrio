name: Release

# On version tags, publishes the Python wheels and source distribution to PyPI, the terrio and
# terrio-cli crates to crates.io, and the WebAssembly package to npm, and attaches the Pyodide
# wheel and the command-line binaries to the GitHub release. All three use trusted
# publishing: no API tokens are stored, each registry trusts this workflow and its environment
# (pypi, crates-io, npm). The artifacts are built by release-build.yml, which
# release-dry-run.yml also runs for pull requests, without publishing. Then linux-packages.yml
# updates the AUR packages and builds the COPR one, with the two secrets it describes (the AUR
# and COPR have no trusted publishing).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/release-build.yml

  github-release:
    # Once the packages are on PyPI, so that a release never announces a version that is not.
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pyodide-wheel
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Attach the Pyodide wheel and the command-line binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --verify-tag --generate-notes
          gh release upload "$tag" dist/*.whl dist/terrio-cli-* --clobber

  linux-packages:
    # The AUR and COPR packages, once the release's binaries are on GitHub.
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The native wheels and the source distribution (the Pyodide wheel goes to the GitHub
      # release only).
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  crates:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # A version already on crates.io (such as a first release published by hand, before the
      # crates trusted this workflow) is skipped rather than failing the job.
      - name: Publish terrio, then terrio-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "terrio") | .version')
          for crate in terrio terrio-cli; do
            if curl -sf -A "terrio release (https://github.com/opengeos/terrio)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate" --locked
            fi
          done

  npm:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Build the package (browsers, bundlers, and Node.js through init)
        run: |
          node js/build.mjs
          node .github/scripts/npm-notices.mjs js/pkg
      - name: Publish unless this version is already on npm
        working-directory: js/pkg
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "terrio-js@$version" version > /dev/null 2>&1; then
            echo "terrio-js $version is already on npm"
          else
            npm publish --access public
          fi
