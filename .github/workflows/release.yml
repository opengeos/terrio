name: Release

# On version tags, publishes Python wheels and a source distribution to PyPI, terrio-crs,
# terrio and terrio-cli to crates.io, and WebAssembly to npm. Attaches the Pyodide wheel
# and command-line binaries to the GitHub release. All three registries use trusted
# publishing: no API tokens are stored, each registry trusts this workflow and its environment
# (pypi, crates-io, npm). The artifacts are built by release-build.yml, which
# release-dry-run.yml can run manually before a release, without publishing. Then linux-packages.yml
# updates the AUR packages and builds the COPR one, with the two secrets it describes (the AUR
# and COPR have no trusted publishing), and docker.yml publishes the image to the GitHub Container
# Registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/release-build.yml

  github-release:
    # Once the packages are on PyPI, so that a release never announces a version that is not.
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pyodide-wheel
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Attach the Pyodide wheel and the command-line binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --verify-tag --generate-notes
          gh release upload "$tag" dist/*.whl dist/terrio-cli-* --clobber

  linux-packages:
    # The AUR and COPR packages, once the release's binaries are on GitHub.
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}

  docker:
    # The image, once the packages are on PyPI, as for the GitHub release.
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The native wheels and the source distribution (the Pyodide wheel goes to the GitHub
      # release only).
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  crates:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Trusted publishing cannot create a crate before it has an owner/configuration.
      # Bootstrap terrio-crs manually and configure its trusted publisher before a tag
      # starts any uploads in this job. See docs/crs.md for the one-time setup.
      - name: Verify terrio-crs has been bootstrapped
        run: |
          if ! curl --fail --silent --show-error -A "terrio release (https://github.com/opengeos/terrio)" https://crates.io/api/v1/crates/terrio-crs > /dev/null; then
            echo "::error::Publish terrio-crs manually and configure its trusted publisher before tagging a release; see docs/crs.md. No crates have been uploaded by this job."
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # A version already on crates.io (such as a first release published by hand, before the
      # crates trusted this workflow) is skipped rather than failing the job.
      - name: Publish terrio-crs, then terrio and terrio-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          for crate in terrio-crs terrio terrio-cli; do
            version=$(echo "$metadata" | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            if curl -sf -A "terrio release (https://github.com/opengeos/terrio)" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io"
            else
              # Cargo waits for index visibility before the next dependent crate:
              # https://doc.rust-lang.org/cargo/commands/cargo-publish.html
              cargo publish -p "$crate" --locked
            fi
          done

  npm:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The threaded and memory64 modules (js/build.mjs): the nightly it pins, with the standard
      # library's sources.
      # Installed first: the last toolchain installed is the default (stable).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      # The memory64 module's C code (Zstandard) needs clang 20 or later (js/build.mjs).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-20
      - name: Build the package (browsers, bundlers, and Node.js through init)
        run: |
          node js/build.mjs
          node .github/scripts/npm-notices.mjs js/pkg
      - name: Publish unless this version is already on npm
        working-directory: js/pkg
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "terrio-js@$version" version > /dev/null 2>&1; then
            echo "terrio-js $version is already on npm"
          else
            npm publish --access public
          fi
