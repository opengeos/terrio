name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p terrio --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and test the npm package (Node.js)
        run: |
          wasm-pack build js --release --target nodejs --out-dir pkg-node --out-name terrio
          node --test js/tests/node.test.mjs
      - name: Build the npm package (browsers and bundlers)
        run: |
          wasm-pack build js --release --target web --out-dir pkg --out-name terrio
          cd js/pkg && npm pkg set name=terrio && npm pack --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: js/pkg

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --release --out dist
          manylinux: auto
          sccache: true
      - name: Install the wheel
        shell: bash
        run: python -m pip install pytest python/dist/*.whl
      - name: Test
        working-directory: python
        run: python -m pytest -v
      - name: Type stubs (mypy --strict, stubtest)
        if: matrix.os == 'ubuntu-latest'
        working-directory: python
        run: |
          python -m pip install mypy
          python -m mypy --strict tests/typing/usage.py
          cd "$RUNNER_TEMP" && python -m mypy.stubtest terrio
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: python/dist/*.whl

  real-data:
    name: real data vs GDAL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gdal
          # The reference: the EPSG table and test points come from GDAL 3.12.2 and PROJ 9.7.1, and
          # newer EPSG databases change some transformations.
          create-args: gdal=3.12.2 libgdal-core=3.12.2 proj=9.7.1 libgdal-arrow-parquet libgdal-jp2openjpeg libgdal-netcdf libgdal-hdf5 numpy pip pytest maturin pyproj pdal laspy lazrs-python pyarrow geopandas shapely
          cache-environment: true
      - uses: actions/cache@v6
        with:
          path: terrio-data
          key: terrio-data-gdal3.12.2-${{ hashFiles('scripts/fetch_test_data.sh', 'scripts/gen_epsg_points.py') }}
      - name: Fetch test data
        shell: micromamba-shell {0}
        run: scripts/fetch_test_data.sh terrio-data
      - name: Build
        run: cargo build --release
      - name: Real-data tests
        env:
          TERRIO_TEST_DATA: ${{ github.workspace }}/terrio-data
        run: cargo test --workspace
      - name: Python bindings against GDAL
        shell: micromamba-shell {0}
        env:
          TERRIO_TEST_DATA: ${{ github.workspace }}/terrio-data
        run: |
          maturin build --release -m python/Cargo.toml -o python/dist
          python -m pip install --no-deps python/dist/*.whl
          cd python && python -m pytest -v
      - name: Compare with GDAL
        # Informational until the format gaps listed in ROADMAP.md are closed.
        continue-on-error: true
        shell: micromamba-shell {0}
        run: python scripts/compare_with_gdal.py terrio-data
      - name: Round-trip rasters through GDAL
        continue-on-error: true
        shell: micromamba-shell {0}
        run: python scripts/raster_roundtrip.py
      - name: Compare vector operations with GDAL
        continue-on-error: true
        shell: micromamba-shell {0}
        run: python scripts/compare_vector_ops_with_gdal.py terrio-data
      - name: Compare Arrow export and import with GDAL, pyarrow and GeoPandas
        continue-on-error: true
        shell: micromamba-shell {0}
        run: python scripts/compare_arrow_with_gdal.py terrio-data
      - name: Compare GeoPackage updates and spatial filters with GDAL
        continue-on-error: true
        shell: micromamba-shell {0}
        run: python scripts/compare_gpkg_with_gdal.py terrio-data --points 200000
      - name: Compare terrain tools and raster algebra with GDAL
        continue-on-error: true
        shell: micromamba-shell {0}
        run: python scripts/compare_dem_calc_with_gdal.py terrio-data
      - name: Compare point clouds with laspy and PDAL
        shell: micromamba-shell {0}
        run: python scripts/compare_pointclouds.py terrio-data
