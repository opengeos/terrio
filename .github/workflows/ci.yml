name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI restores dependencies; per-checkout incremental state is larger and not reused.
  CARGO_INCREMENTAL: 0

jobs:
  # Whether the real-data job runs: on every push to main, and for pull requests unless they
  # change only documentation, the npm package's JavaScript (js/, tested by the wasm job) or
  # other workflows. When the file list is unavailable, it runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      real-data: ${{ steps.pick.outputs.real-data }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "real-data=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The paths a file was renamed from count too.
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[] | .filename, (.previous_filename // empty)'); then
            echo "real-data=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The files API lists at most 3000 files: a longer list may be incomplete.
          if [ "$(echo "$files" | wc -l)" -ge 3000 ]; then
            echo "real-data=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          # The files that cannot change its results. ci.yml can, and so can the js crate's Rust
          # code: js is a workspace member, built and tested natively by cargo test --workspace.
          skip='^(docs/|site/|js/|packaging/|\.github/|[^/]+\.md$|zensical\.toml$|requirements_docs\.txt$|CITATION\.cff$|about\.(hbs|toml)$)'
          keep='^(\.github/workflows/ci\.yml|js/.*\.rs|js/Cargo\.toml)$'
          if echo "$files" | grep -Evq "$skip" || echo "$files" | grep -Eq "$keep"; then
            echo "real-data=true" >> "$GITHUB_OUTPUT"
          else
            echo "real-data=false" >> "$GITHUB_OUTPUT"
            echo "Real-data job skipped: no file it depends on changed."
          fi

  # REUSE (https://reuse.software): every file states its copyright and licence, in an SPDX
  # header (files derived from other projects) or in REUSE.toml.
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  # Known vulnerabilities (RustSec advisories) in the crates Cargo.lock pins, on every pull request
  # and push: advisories are published without the code changing. Unmaintained and unsound crates
  # are listed without failing it. It compiles nothing and fetches the advisory database on each
  # run, so it has no cache.
  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The latest release: an older one can fail to read newer advisories.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # With .cargo/audit.toml, which ignores five advisories of wbraster's dependencies.
      - run: cargo audit
      # cargo audit ignores an advisory by its ID, in every version of the crate. Without the
      # config (read from the working directory), the only vulnerabilities may be those five, in
      # zip 8.6.0 and ruzstd 0.8.3: another crate or version, or a new advisory for these two, fails.
      - name: The ignored advisories are only wbraster's
        working-directory: ${{ runner.temp }}
        run: |
          cargo audit --no-fetch --json --file "$GITHUB_WORKSPACE/Cargo.lock" > audit.json || true
          jq -e '.vulnerabilities.list' audit.json > /dev/null
          found=$(jq -r '.vulnerabilities.list[] | "\(.package.name)@\(.package.version) \(.advisory.id)"' audit.json)
          echo "$found"
          unexpected=$(echo "$found" | grep -vxE 'zip@8\.6\.0 RUSTSEC-2026-0(367|368|369|429)|ruzstd@0\.8\.3 RUSTSEC-2026-0344' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Vulnerabilities other than wbraster's five (zip 8.6.0, ruzstd 0.8.3): ${unexpected//$'\n'/, }"
            exit 1
          fi

  # Linux only: macOS and Windows run in ci-platforms.yml, on every push to main and, for pull
  # requests, by hand or with the label ci:macos, ci:windows or ci:all.
  # The npm package and the conformance report run in ci-extended.yml, on the same terms (labels
  # ci:npm, ci:conformance or ci:all).
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      # Jobs have died of a full disk while compiling (especially on AWS-hosted runners, which
      # start with less free space than Azure-hosted runners), losing their logs: a notice records
      # the space they started with. The toolchains removed are ones these jobs do not use.
      - name: Reclaim runner disk
        run: |
          echo "::notice title=Free disk at start::$(df -h --output=size,used,avail . | tail -1)"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "::notice title=Free disk after reclaiming::$(df -h --output=size,used,avail . | tail -1)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          TERRIO_SQLITE_REFERENCE_PYTHON: python3
      # The `ndarray` feature, off by default: its module and its tests (floating-point reads as
      # arrays, against GDAL's, in `float_reads`).
      - run: cargo clippy -p terrio --features ndarray --lib --test ndarray --test float_reads -- -D warnings
      - run: cargo test -p terrio --features ndarray --test ndarray --test float_reads
      - name: Disk use of the build
        if: always()
        run: |
          df -h .
          if [ -d target ]; then du -sh target; else echo "no target directory"; fi

  gdal:
    name: GDAL backend (feature build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Jobs have died of a full disk while compiling (especially on AWS-hosted runners, which
      # start with less free space than Azure-hosted runners), losing their logs: a notice records
      # the space they started with. The toolchains removed are ones these jobs do not use.
      - name: Reclaim runner disk
        run: |
          echo "::notice title=Free disk at start::$(df -h --output=size,used,avail . | tail -1)"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "::notice title=Free disk after reclaiming::$(df -h --output=size,used,avail . | tail -1)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gdal-backend
          # The GDAL the real-data job compares with, and the drivers the tests use.
          create-args: libgdal-core=3.12.2 proj=9.8.1 libgdal-hdf4 libgdal-hdf5 libgdal-netcdf libgdal-kea
          cache-environment: true
      - name: Point the build at GDAL
        run: |
          prefix="$MAMBA_ROOT_PREFIX/envs/gdal-backend"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "GDAL_DATA=$prefix/share/gdal" >> "$GITHUB_ENV"
          echo "PROJ_DATA=$prefix/share/proj" >> "$GITHUB_ENV"
          # Find libgdal at run time without putting the environment's libraries first for
          # every program.
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$prefix/lib" >> "$GITHUB_ENV"
      - run: pkg-config --modversion gdal
      - run: cargo clippy -p terrio -p terrio-cli --all-targets --features gdal -- -D warnings
      - run: cargo test -p terrio -p terrio-cli --features gdal

  msrv:
    name: MSRV (Rust 1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The `rust-version` of Cargo.toml: keep the two in step. It is an input, not the action's ref,
      # which Dependabot would update as if it were the action's version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p terrio-crs --all-targets --locked
      - run: cargo check -p terrio-crs --all-targets --all-features --locked

  api-docs:
    name: API docs and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Documentation builds without warnings (missing docs included)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p terrio -p terrio-crs --no-deps
          cargo doc -p terrio --no-deps --features ndarray
      - name: Doctests
        run: |
          cargo test -p terrio -p terrio-crs --doc
          cargo test -p terrio --doc --features ndarray
      - name: The crate packages and verifies
        run: cargo publish -p terrio-crs -p terrio -p terrio-cli --dry-run --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Check that LICENSE-THIRD-PARTY.md is up to date
        run: |
          cargo about generate --locked --all-features --fail about.hbs -o LICENSE-THIRD-PARTY.md
          git diff --exit-code LICENSE-THIRD-PARTY.md
      - name: The copies of LICENSE and NOTICE in the packages match the originals
        run: |
          for f in python/LICENSE crates/terrio/LICENSE crates/terrio-cli/LICENSE crates/terrio-crs/LICENSE; do cmp LICENSE "$f"; done
          cmp NOTICE crates/terrio/NOTICE
      - name: The Python sdist carries the license
        working-directory: python
        run: |
          pipx run maturin sdist --out dist
          tar tzf dist/*.tar.gz > sdist.list
          grep -qx '[^/]*/python/LICENSE' sdist.list
      # As the release builds it: the notices copied in, all three files in the sdist.
      - name: The Python sdist carries the notices when they are copied in
        working-directory: python
        run: |
          cp ../NOTICE ../LICENSE-THIRD-PARTY.md .
          rm -rf dist && pipx run maturin sdist --out dist
          python3 ../.github/scripts/check-license-files.py dist/*.tar.gz
      - name: The crates carry LICENSE and NOTICE
        run: |
          cargo package --list -p terrio > terrio.list
          cargo package --list -p terrio-cli > terrio-cli.list
          cargo package --list -p terrio-crs > terrio-crs.list
          grep -qx NOTICE terrio.list
          grep -qx LICENSE terrio.list
          grep -qx LICENSE terrio-cli.list
          grep -qx LICENSE terrio-crs.list
          grep -qx NOTICE terrio-crs.list
          grep -qx data/epsg.tsv.zst terrio-crs.list
          grep -qx data/esri.tsv.zst terrio-crs.list

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p terrio --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # terrio.dev/web: the command line on WASI, run in Node.js on the page's WASI runtime.
      - name: Test the command line in the browser build (WASI)
        env:
          RUSTFLAGS: -C link-arg=-zstack-size=8388608
        run: |
          cargo build -p terrio-cli --bin terrio --target wasm32-wasip1
          TERRIO_WASM=target/wasm32-wasip1/debug/terrio.wasm node --test web/tests/runtime.test.mjs web/tests/paths.test.mjs
      - name: Build and test the npm package (Node.js)
        run: |
          node --test js/tests/build.test.mjs
          wasm-pack build js --release --target nodejs --out-dir pkg-node --out-name terrio
          node --test js/tests/node.test.mjs
      # The lighter module, `terrio-js/core`: the tests of the formats it leaves out are skipped.
      - name: Build and test terrio-js/core (Node.js)
        run: |
          wasm-pack build js --release --target nodejs --out-dir pkg-node/core --out-name terrio --no-pack -- --no-default-features --features core
          TERRIO_JS_PKG=../pkg-node/core/terrio.js node --test js/tests/node.test.mjs

  # The cargo features (see crates/terrio/Cargo.toml): each builds on its own, and so does the
  # core without them, natively and for WebAssembly.
  features:
    name: Cargo features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Each feature on its own, and none
        env:
          RUSTFLAGS: -D warnings
        run: cargo hack check -p terrio --each-feature --no-dev-deps --exclude-features gdal
      # Separate invocations avoid feature unification with Terrio, which enables
      # the projection fallback for backward compatibility.
      - name: Standalone CRS configurations
        run: |
          cargo clippy -p terrio-crs --all-targets -- -D warnings
          cargo clippy -p terrio-crs --all-targets --all-features -- -D warnings
          cargo test -p terrio-crs
          cargo test -p terrio-crs --all-features
          cargo check -p terrio-crs --target wasm32-unknown-unknown
          cargo check -p terrio-crs --all-features --target wasm32-unknown-unknown
      - name: The standalone CRS crate has no C dependency
        run: |
          set -o pipefail
          for target in x86_64-unknown-linux-gnu wasm32-unknown-unknown; do
            crates=$(cargo tree -p terrio-crs -e normal,build --target "$target" --prefix none | cut -d' ' -f1 | sort -u)
            # Pure-Rust crates whose names end in -sys are not C dependencies.
            found=$(echo "$crates" | grep -E '^(cc|cmake|bindgen|pkg-config|cxx-build)$|-sys$' | grep -vE '^(js|web|linux-raw)-sys$' || true)
            if [ -n "$found" ]; then echo "C build dependencies for $target: $found"; exit 1; fi
          done
      # The memory64 build has no C compiler that targets it, so it must not need one. `cc` is left
      # out: rusty_av1d depends on it, but builds no C or assembly with its assembly feature off.
      - name: The JavaScript package has no C dependency
        run: |
          set -o pipefail
          for target in wasm32-unknown-unknown wasm64-unknown-unknown; do
            crates=$(cargo tree -p terrio-js -e normal,build --target "$target" --prefix none | cut -d' ' -f1 | sort -u)
            found=$(echo "$crates" | grep -E '^(ring|cmake|bindgen|pkg-config|cxx-build)$|-sys$' | grep -vE '^(js|web|linux-raw)-sys$' || true)
            if [ -n "$found" ]; then echo "C dependencies for $target: $found"; exit 1; fi
          done
      - name: The core for WebAssembly
        run: cargo build -p terrio --no-default-features --features geotiff --target wasm32-unknown-unknown
      # Every default feature builds for WebAssembly without a C compiler (#180).
      - name: WebAssembly without a C toolchain
        env:
          CC: "false"
          CXX: "false"
          AR: "false"
          CC_wasm32_unknown_unknown: "false"
        run: >-
          cargo build -p terrio --target wasm32-unknown-unknown --no-default-features
          --features geotiff,cad,parquet,remote,avif,netcdf-hdf5,osm,lzma,flatgeobuf,jp2,lerc,pointcloud,tiles,zarr,sqlite,grib,hecras
      - name: The default command-line build without a C toolchain
        env:
          CC: "false"
          CXX: "false"
          AR: "false"
        # The build is the check; the names only fail faster, and with a clearer message.
        run: |
          set -o pipefail
          crates=$(cargo tree -p terrio-cli -e normal,build --prefix none | cut -d' ' -f1 | sort -u)
          found=$(echo "$crates" | grep -E '^(ring|cmake|bindgen|pkg-config|cxx-build)$|-sys$' | grep -vE '^(js|web|linux-raw)-sys$' || true)
          if [ -n "$found" ]; then echo "C dependencies: $found"; exit 1; fi
          cargo build -p terrio-cli
      - name: A GeoTIFF build pulls none of the optional codecs
        run: |
          crates=$(cargo tree -p terrio -e normal --no-default-features --features geotiff --prefix none | cut -d' ' -f1 | sort -u)
          found=$(echo "$crates" | grep -E '^(arrow(-[a-z]+)?|parquet|hdf5(-[a-z]+)?|netcdf(-[a-z]+)?|openjp2|rusty_av1d|lzma-rust2|lerc(-[a-z]+)?|laz|e57|flatgeobuf|osmpbfreader|ureq|hmac|sha2|delaunator|rust-aec|zstd|zstd-safe|zstd-sys)$' || true)
          if [ -n "$found" ]; then echo "unexpected dependencies: $found"; exit 1; fi
          echo "$(echo "$crates" | wc -l) crates"

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --release --out dist
          manylinux: auto
          sccache: true
      - name: Install the wheel
        shell: bash
        # rasterio (with its bundled GDAL) and shapely: terrio.rio is compared with rasterio.
        # xarray, dask, rioxarray, zarr and scipy: terrio.xarray is compared with rioxarray.
        run: python -m pip install pytest "jsonschema>=4.18" rasterio shapely xarray "dask[array]" rioxarray zarr scipy python/dist/*.whl
      - name: Test
        working-directory: python
        run: python -m pytest -v
      - name: Type stubs (mypy --strict, stubtest)
        if: matrix.os == 'ubuntu-latest'
        working-directory: python
        run: |
          python -m pip install mypy
          python -m mypy --strict tests/typing/usage.py
          cd "$RUNNER_TEMP" && python -m mypy.stubtest terrio
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: python/dist/*.whl

  # The Rust and Python tests on real data. The comparison scripts (point clouds, conformance) are
  # in ci-extended.yml, with the same GDAL environment and data; this job saves the data cache.
  real-data:
    name: real data vs GDAL
    needs: changes
    if: needs.changes.outputs.real-data == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This job builds the full workspace in debug mode, builds the Python wheel in release mode,
      # and installs a micromamba GDAL environment plus test data (~38 GB total). Reclaim unused
      # pre-installed toolchains so AWS-hosted runners do not run out of disk space.
      - name: Reclaim runner disk
        run: |
          echo "::notice title=Free disk at start::$(df -h --output=size,used,avail . | tail -1)"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          echo "::notice title=Free disk after reclaiming::$(df -h --output=size,used,avail . | tail -1)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gdal
          # The reference: the EPSG table and test points come from GDAL 3.12.2 and PROJ 9.8.1, and
          # newer EPSG databases change some transformations. rasterio comes from pip (with its
          # bundled GDAL), as conda-forge has none for GDAL 3.12.2 with PROJ 9.8.
          create-args: gdal=3.12.2 libgdal-core=3.12.2 proj=9.8.1 libgdal-arrow-parquet libgdal-jp2openjpeg libgdal-netcdf libgdal-hdf5 libgdal-grib numpy pip pytest maturin pyproj pdal laspy lazrs-python pyarrow geopandas shapely
          cache-environment: true
      - name: Benchmark harness regression tests
        shell: micromamba-shell {0}
        run: python -m pytest -v scripts/tests
      - uses: actions/cache@v6
        with:
          path: terrio-data
          # Holds the datum shift and geoid grids of scripts/proj_grids.txt too (230 MB).
          key: terrio-data-gdal3.12.2-proj9.8.1-${{ hashFiles('scripts/fetch_test_data.sh', 'scripts/gen_epsg_points.py', 'scripts/proj_grids.txt') }}
      - name: Fetch test data
        shell: micromamba-shell {0}
        run: scripts/fetch_test_data.sh terrio-data
      - name: Install rasterio, xarray, dask, rioxarray, zarr and scipy
        # With pip, on top of the cached environment: terrio.rio is compared with rasterio, and
        # terrio.xarray with rioxarray.
        shell: micromamba-shell {0}
        run: python -m pip install "jsonschema>=4.18" rasterio xarray "dask[array]" rioxarray zarr scipy pytest-xdist openpyxl
      # nextest runs the test binaries in parallel, where cargo test runs them one at a time.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Real-data tests
        env:
          TERRIO_TEST_DATA: ${{ github.workspace }}/terrio-data
        run: |
          cargo nextest run --workspace --no-fail-fast
          cargo test --workspace --doc
          cargo test -p terrio-crs
          cargo test -p terrio-crs --all-features
      - name: XLSX workbook interoperability
        shell: micromamba-shell {0}
        run: |
          cargo build -p terrio-cli
          cargo build -p terrio --example xlsx_workbook
          python scripts/conformance.py terrio-data --terrio target/debug/terrio --only xlsx-workbook --strict --output xlsx-workbook.md
      - name: XLSX workbook summary
        if: ${{ always() && hashFiles('xlsx-workbook.md') != '' }}
        run: cat xlsx-workbook.md >> "$GITHUB_STEP_SUMMARY"
      - name: Python bindings against GDAL
        shell: micromamba-shell {0}
        env:
          TERRIO_TEST_DATA: ${{ github.workspace }}/terrio-data
        run: |
          maturin build --release -m python/Cargo.toml -o python/dist
          python -m pip install --no-deps python/dist/*.whl
          cd python && python -m pytest -v -n auto --dist loadfile
      - name: Compare terrio.xarray with rioxarray
        shell: micromamba-shell {0}
        run: |
          python scripts/compare_xarray_with_rioxarray.py terrio-data --output xarray.md
          cat xarray.md >> "$GITHUB_STEP_SUMMARY"
      - name: Disk use of the build
        if: always()
        run: |
          df -h .
          if [ -d target ]; then du -sh target; else echo "no target directory"; fi
