name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI restores dependencies; per-checkout incremental state is larger and not reused.
  CARGO_INCREMENTAL: 0

jobs:
  # Linux only: macOS and Windows run in ci-platforms.yml, on every push to main and, for pull
  # requests, by hand or with the label ci:macos, ci:windows or ci:all.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  gdal:
    name: GDAL backend (feature build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gdal-backend
          # The GDAL the real-data job compares with, and the drivers the tests use.
          create-args: libgdal-core=3.12.2 proj=9.8.1 libgdal-hdf4 libgdal-hdf5 libgdal-netcdf libgdal-kea
          cache-environment: true
      - name: Point the build at GDAL
        run: |
          prefix="$MAMBA_ROOT_PREFIX/envs/gdal-backend"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "GDAL_DATA=$prefix/share/gdal" >> "$GITHUB_ENV"
          echo "PROJ_DATA=$prefix/share/proj" >> "$GITHUB_ENV"
          # Find libgdal at run time without putting the environment's libraries first for
          # every program.
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$prefix/lib" >> "$GITHUB_ENV"
      - run: pkg-config --modversion gdal
      - run: cargo clippy -p terrio -p terrio-cli --all-targets --features gdal -- -D warnings
      - run: cargo test -p terrio -p terrio-cli --features gdal

  msrv:
    name: MSRV (Rust 1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The `rust-version` of Cargo.toml: keep the two in step. It is an input, not the action's ref,
      # which Dependabot would update as if it were the action's version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p terrio-crs --all-targets --locked
      - run: cargo check -p terrio-crs --all-targets --all-features --locked

  api-docs:
    name: API docs and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Documentation builds without warnings (missing docs included)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p terrio -p terrio-crs --no-deps
      - name: Doctests
        run: cargo test -p terrio -p terrio-crs --doc
      - name: The crate packages and verifies
        run: cargo publish -p terrio-crs -p terrio --dry-run
      - name: The copies of LICENSE and NOTICE in the packages match the originals
        run: |
          for f in python/LICENSE crates/terrio/LICENSE crates/terrio-cli/LICENSE crates/terrio-crs/LICENSE; do cmp LICENSE "$f"; done
          cmp NOTICE crates/terrio/NOTICE
      - name: The Python sdist carries the license
        working-directory: python
        run: |
          pipx run maturin sdist --out dist
          tar tzf dist/*.tar.gz > sdist.list
          grep -qx '[^/]*/python/LICENSE' sdist.list
      # As the release builds it: the notices copied in, all three files in the sdist.
      - name: The Python sdist carries the notices when they are copied in
        working-directory: python
        run: |
          cp ../NOTICE ../LICENSE-THIRD-PARTY.md .
          rm -rf dist && pipx run maturin sdist --out dist
          python3 ../.github/scripts/check-license-files.py dist/*.tar.gz
      - name: The crates carry LICENSE and NOTICE
        run: |
          cargo package --list -p terrio > terrio.list
          cargo package --list -p terrio-cli > terrio-cli.list
          cargo package --list -p terrio-crs > terrio-crs.list
          grep -qx NOTICE terrio.list
          grep -qx LICENSE terrio.list
          grep -qx LICENSE terrio-cli.list
          grep -qx LICENSE terrio-crs.list
          grep -qx NOTICE terrio-crs.list
          grep -qx data/epsg.tsv.zst terrio-crs.list
          grep -qx data/esri.tsv.zst terrio-crs.list

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p terrio --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and test the npm package (Node.js)
        run: |
          wasm-pack build js --release --target nodejs --out-dir pkg-node --out-name terrio
          node --test js/tests/node.test.mjs
      # The lighter module, `terrio-js/core`: the tests of the formats it leaves out are skipped.
      - name: Build and test terrio-js/core (Node.js)
        run: |
          wasm-pack build js --release --target nodejs --out-dir pkg-node/core --out-name terrio --no-pack -- --no-default-features --features core
          TERRIO_JS_PKG=../pkg-node/core/terrio.js node --test js/tests/node.test.mjs

  # The npm package as the release builds it: both modules, optimized for size.
  npm:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The threaded and memory64 modules rebuild the standard library (with atomics; for wasm64):
      # the nightly js/build.mjs pins, with its sources.
      # Installed first: the last toolchain installed is the default (stable).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # Node.js 24 or later: memory64.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The memory64 module's C code (Zstandard) needs clang 20 or later (js/build.mjs).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-20
      - name: Build the npm package (browsers, bundlers, and Node.js through init)
        run: |
          node js/build.mjs
          node .github/scripts/npm-notices.mjs js/pkg
      - name: Test it, and pack it
        run: |
          node --test js/tests/package.test.mjs
          # The whole Node.js suite on the threaded module, as terrio-js/load starts it.
          TERRIO_JS_LOAD=../pkg/load.js node --test js/tests/node.test.mjs
          # And on the memory64 module.
          TERRIO_JS_LOAD=../pkg/load.js TERRIO_MEMORY64=1 node --test js/tests/node.test.mjs
          ls -l js/pkg/terrio_bg.wasm js/pkg/core/terrio_bg.wasm js/pkg/threads/terrio_bg.wasm js/pkg/memory64/terrio_bg.wasm
          cd js/pkg && npm pack --dry-run
      - name: In headless Chromium and Firefox, threaded on a cross-origin isolated page
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.64.1 > /dev/null
          npx playwright install --with-deps chromium firefox > /dev/null
          cd "$GITHUB_WORKSPACE"
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright" BROWSERS=chromium,firefox node js/tests/browser.mjs
      - name: Import the modules by their package names
        run: |
          mkdir -p "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/js/pkg"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { createRequire } from "node:module";
            const require = createRequire(process.cwd() + "/");
            for (const name of ["terrio-js", "terrio-js/core"]) {
              const m = await import(name);
              const wasm = require.resolve(name === "terrio-js" ? "terrio-js/terrio_bg.wasm" : "terrio-js/core/terrio_bg.wasm");
              await m.default({ module_or_path: readFileSync(wasm) });
              console.log(name, m.version(), JSON.stringify(m.features()));
            }
            const { load } = await import("terrio-js/load");
            const threaded = await load();
            if (threaded.features().build !== "terrio-js/threads") throw new Error("not threaded");
            console.log("terrio-js/load", JSON.stringify(threaded.features()));
            const wide = await load({ memory64: true });
            if (wide.features().build !== "terrio-js/memory64") throw new Error("not memory64");
            console.log("terrio-js/load memory64", JSON.stringify(wide.features()));'
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: js/pkg

  # The cargo features (see crates/terrio/Cargo.toml): each builds on its own, and so does the
  # core without them, natively and for WebAssembly.
  features:
    name: Cargo features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Each feature on its own, and none
        env:
          RUSTFLAGS: -D warnings
        run: cargo hack check -p terrio --each-feature --no-dev-deps --exclude-features gdal
      # Separate invocations avoid feature unification with Terrio, which enables
      # the projection fallback for backward compatibility.
      - name: Standalone CRS configurations
        run: |
          cargo clippy -p terrio-crs --all-targets -- -D warnings
          cargo clippy -p terrio-crs --all-targets --all-features -- -D warnings
          cargo test -p terrio-crs
          cargo test -p terrio-crs --all-features
          cargo check -p terrio-crs --target wasm32-unknown-unknown
          cargo check -p terrio-crs --all-features --target wasm32-unknown-unknown
      - name: The core for WebAssembly
        run: cargo build -p terrio --no-default-features --features geotiff --target wasm32-unknown-unknown
      # Every default feature but GeoParquet (whose Zstandard is the zstd C library) builds for
      # WebAssembly without a C compiler (#180).
      - name: WebAssembly without a C toolchain
        env:
          CC: "false"
          CXX: "false"
          AR: "false"
          CC_wasm32_unknown_unknown: "false"
        run: >-
          cargo build -p terrio --target wasm32-unknown-unknown --no-default-features
          --features geotiff,remote,avif,netcdf-hdf5,osm,lzma,flatgeobuf,jp2,lerc,pointcloud,tiles,zarr,sqlite,grib
      - name: A GeoTIFF build pulls none of the optional codecs
        run: |
          crates=$(cargo tree -p terrio -e normal --no-default-features --features geotiff --prefix none | cut -d' ' -f1 | sort -u)
          found=$(echo "$crates" | grep -E '^(arrow(-[a-z]+)?|parquet|hdf5(-[a-z]+)?|netcdf(-[a-z]+)?|openjp2|rusty_av1d|lzma-rust2|lerc(-[a-z]+)?|laz|e57|flatgeobuf|osmpbfreader|ureq|hmac|sha2|delaunator|gribberish|bitvec)$' || true)
          if [ -n "$found" ]; then echo "unexpected dependencies: $found"; exit 1; fi
          echo "$(echo "$crates" | wc -l) crates"

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --release --out dist
          manylinux: auto
          sccache: true
      - name: Install the wheel
        shell: bash
        # rasterio (with its bundled GDAL) and shapely: terrio.rio is compared with rasterio.
        # xarray, dask, rioxarray, zarr and scipy: terrio.xarray is compared with rioxarray.
        run: python -m pip install pytest rasterio shapely xarray "dask[array]" rioxarray zarr scipy python/dist/*.whl
      - name: Test
        working-directory: python
        run: python -m pytest -v
      - name: Type stubs (mypy --strict, stubtest)
        if: matrix.os == 'ubuntu-latest'
        working-directory: python
        run: |
          python -m pip install mypy
          python -m mypy --strict tests/typing/usage.py
          cd "$RUNNER_TEMP" && python -m mypy.stubtest terrio
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: python/dist/*.whl

  # The real-data checks are two jobs run side by side: the Rust and Python tests, and the
  # comparison scripts (point clouds, conformance). Both use the same GDAL environment and data.
  real-data:
    name: real data vs GDAL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gdal
          # The reference: the EPSG table and test points come from GDAL 3.12.2 and PROJ 9.8.1, and
          # newer EPSG databases change some transformations. rasterio comes from pip (with its
          # bundled GDAL), as conda-forge has none for GDAL 3.12.2 with PROJ 9.8.
          create-args: gdal=3.12.2 libgdal-core=3.12.2 proj=9.8.1 libgdal-arrow-parquet libgdal-jp2openjpeg libgdal-netcdf libgdal-hdf5 libgdal-grib numpy pip pytest maturin pyproj pdal laspy lazrs-python pyarrow geopandas shapely
          cache-environment: true
      - uses: actions/cache@v6
        with:
          path: terrio-data
          # Holds the datum shift and geoid grids of scripts/proj_grids.txt too (230 MB).
          key: terrio-data-gdal3.12.2-proj9.8.1-${{ hashFiles('scripts/fetch_test_data.sh', 'scripts/gen_epsg_points.py', 'scripts/proj_grids.txt') }}
      - name: Fetch test data
        shell: micromamba-shell {0}
        run: scripts/fetch_test_data.sh terrio-data
      - name: Install rasterio, xarray, dask, rioxarray, zarr and scipy
        # With pip, on top of the cached environment: terrio.rio is compared with rasterio, and
        # terrio.xarray with rioxarray.
        shell: micromamba-shell {0}
        run: python -m pip install rasterio xarray "dask[array]" rioxarray zarr scipy
      - name: Real-data tests
        env:
          TERRIO_TEST_DATA: ${{ github.workspace }}/terrio-data
        run: |
          cargo test --workspace
          cargo test -p terrio-crs
          cargo test -p terrio-crs --all-features
      - name: Python bindings against GDAL
        shell: micromamba-shell {0}
        env:
          TERRIO_TEST_DATA: ${{ github.workspace }}/terrio-data
        run: |
          maturin build --release -m python/Cargo.toml -o python/dist
          python -m pip install --no-deps python/dist/*.whl
          cd python && python -m pytest -v
      - name: Compare terrio.xarray with rioxarray
        shell: micromamba-shell {0}
        run: |
          python scripts/compare_xarray_with_rioxarray.py terrio-data --output xarray.md
          cat xarray.md >> "$GITHUB_STEP_SUMMARY"

  conformance:
    name: point clouds and conformance vs GDAL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gdal
          # As in the real-data job: the two share the cached environment.
          create-args: gdal=3.12.2 libgdal-core=3.12.2 proj=9.8.1 libgdal-arrow-parquet libgdal-jp2openjpeg libgdal-netcdf libgdal-hdf5 libgdal-grib numpy pip pytest maturin pyproj pdal laspy lazrs-python pyarrow geopandas shapely
          cache-environment: true
      - name: Benchmark harness regression tests
        shell: micromamba-shell {0}
        run: python -m unittest discover -s scripts/tests -v
      # Restores the real-data job's data; only that job saves it.
      - uses: actions/cache/restore@v6
        with:
          path: terrio-data
          key: terrio-data-gdal3.12.2-proj9.8.1-${{ hashFiles('scripts/fetch_test_data.sh', 'scripts/gen_epsg_points.py', 'scripts/proj_grids.txt') }}
      - name: Fetch test data
        shell: micromamba-shell {0}
        run: scripts/fetch_test_data.sh terrio-data
      - name: Build
        run: cargo build --release
      - name: Build and install the Python bindings
        shell: micromamba-shell {0}
        run: |
          maturin build --release -m python/Cargo.toml -o python/dist
          python -m pip install --no-deps python/dist/*.whl
      - name: Install multidimensional reference packages
        shell: micromamba-shell {0}
        run: python -m pip install xarray h5netcdf h5py zarr
      - name: Compare point clouds with laspy and PDAL
        shell: micromamba-shell {0}
        # Kept for the conformance report below, which reads it instead of comparing again. Pull
        # requests compare the filters on autzen_trim.las only; pushes to main on the Madison
        # lidar (4 million points) too, which takes about 20 minutes more.
        run: |
          set -o pipefail
          python -u scripts/compare_pointclouds.py terrio-data ${{ github.event_name == 'pull_request' && '--quick' || '' }} | tee pointclouds.log
      - name: Conformance suite (every comparison with GDAL, laspy and PDAL)
        # Informational: differences are listed in the report, not failures. The step fails when
        # a suite cannot run.
        shell: micromamba-shell {0}
        run: |
          python -m pip install h5py
          TERRIO_POINTCLOUDS_LOG=pointclouds.log python scripts/conformance.py terrio-data --output conformance.md --json conformance.json --jobs 4
          cat conformance.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-report
          path: |
            conformance.md
            conformance.json
