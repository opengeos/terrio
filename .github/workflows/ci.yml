name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p terrio --target wasm32-unknown-unknown

  real-data:
    name: real data vs GDAL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal
          create-args: gdal libgdal-arrow-parquet libgdal-jp2openjpeg libgdal-netcdf libgdal-hdf5 numpy
          cache-environment: true
      - uses: actions/cache@v4
        with:
          path: terrio-data
          key: terrio-data-${{ hashFiles('scripts/fetch_test_data.sh') }}
      - name: Fetch test data
        shell: micromamba-shell {0}
        run: scripts/fetch_test_data.sh terrio-data
      - name: Build
        run: cargo build --release
      - name: Real-data tests
        env:
          TERRIO_TEST_DATA: ${{ github.workspace }}/terrio-data
        run: cargo test --workspace
      - name: Compare with GDAL
        # Informational until the format gaps listed in ROADMAP.md are closed.
        continue-on-error: true
        shell: micromamba-shell {0}
        run: python scripts/compare_with_gdal.py terrio-data
