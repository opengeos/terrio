name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  gdal:
    name: GDAL backend (feature build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gdal-backend
          # The GDAL the real-data job compares with, and the drivers the tests use.
          create-args: libgdal-core=3.12.2 proj=9.7.1 libgdal-hdf4 libgdal-hdf5 libgdal-netcdf libgdal-kea
          cache-environment: true
      - name: Point the build at GDAL
        run: |
          prefix="$MAMBA_ROOT_PREFIX/envs/gdal-backend"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "GDAL_DATA=$prefix/share/gdal" >> "$GITHUB_ENV"
          echo "PROJ_DATA=$prefix/share/proj" >> "$GITHUB_ENV"
          # Find libgdal at run time without putting the environment's libraries first for
          # every program.
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$prefix/lib" >> "$GITHUB_ENV"
      - run: pkg-config --modversion gdal
      - run: cargo clippy -p terrio -p terrio-cli --all-targets --features gdal -- -D warnings
      - run: cargo test -p terrio -p terrio-cli --features gdal

  msrv:
    name: MSRV (Rust 1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The `rust-version` of Cargo.toml: keep the two in step.
      - uses: dtolnay/rust-toolchain@1.120
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  api-docs:
    name: API docs and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Documentation builds without warnings (missing docs included)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p terrio --no-deps
      - name: Doctests
        run: cargo test -p terrio --doc
      - name: The crate packages and verifies
        run: cargo publish -p terrio --dry-run

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p terrio --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and test the npm package (Node.js)
        run: |
          wasm-pack build js --release --target nodejs --out-dir pkg-node --out-name terrio
          node --test js/tests/node.test.mjs
      - name: Build the npm package (browsers and bundlers)
        run: |
          wasm-pack build js --release --target web --out-dir pkg --out-name terrio
          cp LICENSE js/pkg/ && cd js/pkg && npm pack --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: js/pkg

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --release --out dist
          manylinux: auto
          sccache: true
      - name: Install the wheel
        shell: bash
        run: python -m pip install pytest python/dist/*.whl
      - name: Test
        working-directory: python
        run: python -m pytest -v
      - name: Type stubs (mypy --strict, stubtest)
        if: matrix.os == 'ubuntu-latest'
        working-directory: python
        run: |
          python -m pip install mypy
          python -m mypy --strict tests/typing/usage.py
          cd "$RUNNER_TEMP" && python -m mypy.stubtest terrio
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: python/dist/*.whl

  real-data:
    name: real data vs GDAL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gdal
          # The reference: the EPSG table and test points come from GDAL 3.12.2 and PROJ 9.7.1, and
          # newer EPSG databases change some transformations.
          create-args: gdal=3.12.2 libgdal-core=3.12.2 proj=9.7.1 libgdal-arrow-parquet libgdal-jp2openjpeg libgdal-netcdf libgdal-hdf5 numpy pip pytest maturin pyproj pdal laspy lazrs-python pyarrow geopandas shapely
          cache-environment: true
      - uses: actions/cache@v6
        with:
          path: terrio-data
          key: terrio-data-gdal3.12.2-${{ hashFiles('scripts/fetch_test_data.sh', 'scripts/gen_epsg_points.py') }}
      - name: Fetch test data
        shell: micromamba-shell {0}
        run: scripts/fetch_test_data.sh terrio-data
      - name: Build
        run: cargo build --release
      - name: Real-data tests
        env:
          TERRIO_TEST_DATA: ${{ github.workspace }}/terrio-data
        run: cargo test --workspace
      - name: Python bindings against GDAL
        shell: micromamba-shell {0}
        env:
          TERRIO_TEST_DATA: ${{ github.workspace }}/terrio-data
        run: |
          maturin build --release -m python/Cargo.toml -o python/dist
          python -m pip install --no-deps python/dist/*.whl
          cd python && python -m pytest -v
      - name: Compare point clouds with laspy and PDAL
        shell: micromamba-shell {0}
        run: python scripts/compare_pointclouds.py terrio-data
      - name: Conformance suite (every comparison with GDAL, laspy and PDAL)
        # Informational: differences are listed in the report, not failures. The step fails when
        # a suite cannot run.
        shell: micromamba-shell {0}
        run: |
          python scripts/conformance.py terrio-data --output conformance.md --json conformance.json --jobs 2
          cat conformance.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-report
          path: |
            conformance.md
            conformance.json
