name: Release build

# The release artifacts: the Python wheels for every platform, the source distribution, the
# Pyodide wheel (tested in Pyodide under Node.js) and the `terrio` command-line binaries, with
# the installers that download them. Called by release.yml, which publishes them on
# tags, and by release-dry-run.yml, which builds them for pull requests without publishing.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.platform.os }}, ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          # manylinux2014's cross compiler is too old for ring's ARM assembly.
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64, manylinux: auto }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
          # Built natively on GitHub's Arm64 Windows runner.
          - { os: windows-11-arm, target: aarch64, manylinux: auto }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The notices, which maturin finds in python/ (by the default license-files globs, LICENSE*
      # and NOTICE*) with python/LICENSE, a copy of LICENSE kept in the repository. Not gitignored:
      # maturin leaves ignored files out of the sdist.
      - name: Add the notices
        shell: bash
        run: cp NOTICE LICENSE-THIRD-PARTY.md python/
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist
      - name: Check that the wheel carries the license files
        shell: bash
        run: python .github/scripts/check-license-files.py python/dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The notices, which maturin finds in python/ (by the default license-files globs, LICENSE*
      # and NOTICE*) with python/LICENSE, a copy of LICENSE kept in the repository. Not gitignored:
      # maturin leaves ignored files out of the sdist.
      - name: Add the notices
        shell: bash
        run: cp NOTICE LICENSE-THIRD-PARTY.md python/
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - name: Check that the sdist carries the license files
        run: python3 .github/scripts/check-license-files.py python/dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: python/dist

  # Pyodide (WebAssembly in the browser and Node.js): a wheel for the Python and Emscripten
  # versions of the pinned Pyodide release, tested in Pyodide under Node.js. It is attached to the
  # GitHub release, not published to PyPI.
  pyodide:
    name: wheels (pyodide)
    runs-on: ubuntu-latest
    env:
      PYODIDE_VERSION: "0.29.5"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Rust's Emscripten target uses WebAssembly exception handling, as Pyodide 0.28 and later
      # need, by default since Rust 1.93: stable Rust builds the wheel.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - name: Install pyodide-build and the cross-build environment
        run: |
          python -m pip install pyodide-build
          pyodide xbuildenv install "$PYODIDE_VERSION"
          echo "EMSCRIPTEN_VERSION=$(pyodide config get emscripten_version)" >> "$GITHUB_ENV"
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Add the notices
        run: cp NOTICE LICENSE-THIRD-PARTY.md python/
      - name: Build the wheel
        working-directory: python
        # pyodide-build's default flags are for its pinned nightly toolchain (-Z flags); stable
        # Rust needs only the side-module link flag.
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS: "-C link-arg=-sSIDE_MODULE=2"
        run: pyodide build -o dist
      - name: Check that the wheel carries the license files
        run: python .github/scripts/check-license-files.py python/dist/*.whl
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the wheel in Pyodide under Node.js
        run: |
          mkdir -p "$RUNNER_TEMP/pyodide" && cd "$RUNNER_TEMP/pyodide"
          npm init -y > /dev/null
          npm install "pyodide@$PYODIDE_VERSION"
          cp "$GITHUB_WORKSPACE/python/tests/pyodide/smoke.mjs" .
          node smoke.mjs "$(ls "$GITHUB_WORKSPACE"/python/dist/*.whl)"
      - uses: actions/upload-artifact@v7
        with:
          name: pyodide-wheel
          path: python/dist/*.whl

  # The `terrio` command-line tool, for those without a Rust toolchain: an archive per platform
  # (tar.gz, zip on Windows) with the binary, the license and the README, attached to the GitHub
  # release, where `cargo binstall terrio-cli` finds them too. Linux builds are static (musl), so
  # they run on any distribution.
  cli:
    name: cli (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - name: Install the musl C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        # Without the symbol table, about a quarter of the binary.
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo build --release --locked -p terrio-cli --target ${{ matrix.platform.target }}
      - name: Check the binary runs
        shell: bash
        run: |
          bin="target/${{ matrix.platform.target }}/release/terrio"
          "$bin" --version
          "$bin" formats > /dev/null
      - name: Package
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "terrio-cli") | .version')
          name="terrio-cli-v$version-${{ matrix.platform.target }}"
          mkdir -p "dist/$name"
          cp LICENSE NOTICE LICENSE-THIRD-PARTY.md README.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp "../target/${{ matrix.platform.target }}/release/terrio.exe" "$name/"
            7z a -tzip -bd "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "../target/${{ matrix.platform.target }}/release/terrio" "$name/"
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform.target }}
          path: dist/*

  # The installers (docs/install.sh, docs/install.ps1, served by the documentation site), run
  # against the binaries just built: served from a local HTTP server standing in for the release.
  installers:
    name: installer (${{ matrix.os }})
    needs: [cli]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: release
          merge-multiple: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Each step starts its own server: a background process need not outlive its step.
      - name: Stage the archives and the installers
        shell: bash
        run: |
          echo "TERRIO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_ENV"
          echo "TERRIO_DOWNLOAD_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          cp docs/install.sh docs/install.ps1 release/
      - name: install.sh (sh, and shellcheck)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.os }}" = ubuntu-latest ]; then shellcheck docs/install.sh; fi
          (cd release && python -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8000/ > /dev/null && break; sleep 1; done
          curl -LsSf http://127.0.0.1:8000/install.sh | sh
          test "$("$HOME/.local/bin/terrio" --version)" = "terrio $TERRIO_VERSION"
      - name: install.ps1 (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Start-Process python -ArgumentList "-m", "http.server", "8000", "--bind", "127.0.0.1" -WorkingDirectory release -WindowStyle Hidden
          foreach ($i in 1..30) { try { Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing | Out-Null; break } catch { Start-Sleep 1 } }
          irm http://127.0.0.1:8000/install.ps1 | iex
          if ((& "$env:USERPROFILE\.local\bin\terrio.exe" --version) -ne "terrio $env:TERRIO_VERSION") { throw "wrong version" }
      - name: install.ps1 (PowerShell 7, into another directory)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TERRIO_INSTALL_DIR: ${{ runner.temp }}\terrio-bin
          TERRIO_NO_MODIFY_PATH: "1"
        run: |
          # The server of the previous step, if it is still running, or a new one.
          Start-Process python -ArgumentList "-m", "http.server", "8000", "--bind", "127.0.0.1" -WorkingDirectory release -WindowStyle Hidden
          foreach ($i in 1..30) { try { Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing | Out-Null; break } catch { Start-Sleep 1 } }
          irm http://127.0.0.1:8000/install.ps1 | iex
          if ((& "$env:TERRIO_INSTALL_DIR\terrio.exe" --version) -ne "terrio $env:TERRIO_VERSION") { throw "wrong version" }
